e string Example strImage = objGeoMaps.getIcon( role, color ); set(property, value) This Method is the default setter of the Class. Parameters: Name Type Description property string The Property to set value mixed The Value to set Returns: Type void Example objGeoMaps.set( property, value ); setMap(lat, lng) This Method set the Map in the Page. Parameters: Name Type Description lat number The current Latidude lng number The current Langidude Returns: Type void Example objGeoMaps.setMap( lat, lng ); setMarker(id, role, color, lat, lng, content) This Method set a Marker with Popup on the Map. Parameters: Name Type Description id string The Game Player Id role string The Game Player Role (player, hunter or management) color string The Game Player Color lat number The Latidude of the Game Player lng number The Langidude of the Game Player content string The Content of the Popup Returns: Type void Example objGeoMaps.setMarker( id, role, color, lat, lng, content ); × Search results Close Documentation generated by JSDoc 4.0.5 on 2026-06-07T15:47:18+02:00 using the DocStrap template. "},"GeoTracker.html":{"id":"GeoTracker.html","title":"Class: GeoTracker","body":" Documentation Namespaces friendshunt Classes GeoMapsGeoTracker Class: GeoTracker GeoTracker Geo Tracker Class for the Friends Hunt App. This Class represents the Geo Tracker Class for the Friends Hunt App with his Properties and Methods. The Class is for handling Position Tracking, Step Counting and Calculte Distances. The Class can start inverval Tracking and used the Wake Lock API. new GeoTracker() This Method is the Constructor for this Class. Version: 0.1.0 Since: 2026-06-05 Author: Markus Götz Example var objGeoTracker = new GeoTracker(); Methods calcDistance(lat1, lng1, lat2, lng2) This Method calculate the Distance between two Points on the Earth's surface with the Haversine-Formula. Parameters: Name Type Description lat1 number The Latidude of Waypoint 1 (float) lng1 number The Langidude of Waypoint 1 (float) lat2 number The Latidude of Waypoint 2 (float) lng2 number The Langidude of Waypoint 2 (float) Returns: distance The Distance between Waypoint 1 and Waypoint 2 in Meters (float) Type number Example var floatDistance = objGeoTracker.calcDistance( lat1, lng1, lat2, lng2 ); get(property) This Method is the default getter of the Class. Parameters: Name Type Description property string The Property to get Returns: value The Value of the Property Type mixed Example var value = objGeoTracker.stepCount( property ); getCurrentPosition(callbackSuccess) This Method get the current Position, called the Callback Function and hand over the Position Data. Parameters: Name Type Description callbackSuccess string The Property to set Returns: Type void Example objGeoTracker.getCurrentPosition( callbackSuccess ); set(property, value) This Method is the default setter of the Class. Parameters: Name Type Description property string The Property to set value mixed The Value to set Returns: Type void Example objGeoTracker.set( property, value ); startIntervalTracking(callbackSuccess) This Method start the interval Tracking and get periodically the current Position, called the Callback Function and hand over the Position Data. Parameters: Name Type Description callbackSuccess string The Property to set Returns: Type void Example objGeoTracker.startIntervalTracking( callbackSuccess ); startPedometer() This Method start the Pedometer to count the steps. Returns: Type void Example objGeoTracker.startPedometer(); &lt;async&gt; startWakeLock() This Method starts the Wake Look, so that the Device does not go into Sleep Mode or lock the Screen. Returns: Type void Example objGeoTracker.startWakeLock(); stopIntervalTracking() This Method stop the interval Tracking. Returns: Type void Example objGeoTracker.stopIntervalTracking(); stopWakeLock() This Method stops the Wake Look Mode, the Device can go into Sleep Mode or lock the Screen. Returns: Type void Example objGeoTracker.stopWakeLock(); × S
