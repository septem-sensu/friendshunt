e with Battery Level and is the Battery curren charging. Returns: objBatteryState objBatteryState Type object Example var objBatteryState = objBatteryTracker.getBatteryData(); init() This Method initializes the Battery API and binds the event listeners. Returns: objPromise Returns a promise once initialization is complete Type Promise Example var objPromise = objBatteryTracker.init(); set(property, value) This Method is the default setter of the Class. Parameters: Name Type Description property string The Property to set value mixed The Value to set Returns: Type void Example objBatteryTracker.set( property, value ); updateBatteryData() This Method updates the internal properties when the API fires an event. The Method is the Callback Function of the init Method. Returns: Type void Example objBatteryTracker.updateBatteryData(); × Search results Close Documentation generated by JSDoc 4.0.5 on 2026-06-14T09:47:18+02:00 using the DocStrap template. "},"GeoMaps.html":{"id":"GeoMaps.html","title":"Class: GeoMaps","body":" Documentation Namespaces friendshunt Classes BatteryTrackerGeoMapsGeoTracker Class: GeoMaps GeoMaps Geo Maps Class for the Friends Hunt App. This Class represents the Geo Maps Class for the Friends Hunt App with his Properties and Methods. The Class is for handling Leaflet with OpenStreetMap. new GeoMaps() This Method is the Constructor for this Class. Version: 0.1.0 Since: 2026-06-05 Author: Markus Götz Example var objGeoMaps = new GeoMaps(); Methods bindResizeEvents(id, selectorRadius) This Method is a Helper Method to bind Event Listener for Drag and Drop to set the circle radius on the Map interactive. Parameters: Name Type Description id string The Game Player Id selectorRadius number The Selector of a input Fiel to set the radius Returns: Type void Example objGeoMaps.bindResizeEvents( id, selectorRadius ); get(property) This Method is the default getter of the Class. Parameters: Name Type Description property string The Property to get Returns: value The Value of the Property Type mixed Example var value = objGeoMaps.get( property ); getDistance(id1, id2) This Method return the calculated distance between two Ids in Meters. Parameters: Name Type Description id1 string The Id1 id2 string The Id2 Returns: floatDistance The distance between two Ids in Meters Type number Example floatDistance = objGeoMaps.getDistance( id1, id2 ); getIcon(role, color) This Method returns a Icon Vector Object for the Game Player Role. Parameters: Name Type Description role string The Game Player Role (player, hunter or management) color string The Game Player Color Returns: strImage The Vector Object Image Type string Example strImage = objGeoMaps.getIcon( role, color ); getPosition(id) This Method return the Position Object of a Id. Parameters: Name Type Description id string The Id Returns: objPosition The Leaflet Position Object Type object Example objPosition = objGeoMaps.getPosition( id ); removeMarker(id) This Method remove a Marker from the Map. Parameters: Name Type Description id string The Game Player Id to remove from Map Returns: Type void Example objGeoMaps.removeMarker( id ); set(property, value) This Method is the default setter of the Class. Parameters: Name Type Description property string The Property to set value mixed The Value to set Returns: Type void Example objGeoMaps.set( property, value ); setCircle(id, lat, lng, size, color, weight, fillColor, opacity) This Method set a circle on the Map. Parameters: Name Type Description id string The Game Player Id lat number The Latidude of the Center of the Circle lng number The Langidude of the Center of the Circle size number The Radius of the Circle color string The Color of the Circle edge weight number The weight of the Corcle edge fillColor string The fill Color of the Circle opacity number The Opacity of the Circle Returns: Type void Example objGeoMaps.setCircle( id, lat, lng, size, color, weight, fillColor, opacity ); setCircleInteractive(id, size, color, weight, fillColor, opacity, selector, selectorRadius) This Method set a circle on the Map interactive with click to the Map. Parameters: Name Type Description id string The Game Player Id size number The Radius of the Circle color string The Color of the Circle edge weight number The weight of the Corcle edge fillColor string The fill Color of the Circle opacity number The Opacity of the Circle selector number The Selector of a input Fiel to set the coordinates selectorRadius number The Selector of a input Fiel to set the radius Returns: Type void Example objGeoMaps.setCircleInteractive( id, size, color, weight, fillColor, opacity, selector, selectorRadius ); setMap(lat, lng) This Method set the Map in the Page. Parameters: Name Type Description lat number The current Latidude lng number The current Langidude Returns: objMap The Leaflet Map Object Type object Example var objMap = objGeoMaps.setMap( lat, lng ); setMarker(id, role, color, lat, lng, content) This Method set a Marker with Popup on the Map. Parameters: Name Type Description id string The Game Player Id role string The Game Player Role (player, hunter or management) color string The Game Player Color lat number The Latidude of the Game Player lng number The Langidude of the Game Player content string The Content of the Popup Returns: Type void Example objGeoMaps.setMarker( id, role, color, lat, lng, content ); setMarkerInteractive(id, role, color, content, selector) This Method set a Marker with Popup interactive with click on the Map. Parameters: Name Type Description id string The Game Player Id role string The Game Player Role (player, hunter or management) color string The Game Player Color content string The Content of the Popup selector string The Selector of a input Fiel to set the coordinates Returns: Type void Example objGeoMaps.setMarkerInteractive( id, role, color, content, selector ); × Search results Close Documentation generated by JSDoc 4.0.5 on 2026-06-14T09:47:18+02:00 using the DocStrap template. "},"GeoTracker.html":{"id":"GeoTracker.html","title":"Class: GeoTracker","body":" Documentation Namespaces friendshunt Classes BatteryTrackerGeoMapsGeoTracker Class: GeoTracker GeoTracker Geo Tracker Class for the Friends Hunt App. This Class represents the Geo Tracker Class for the Friends Hunt App with his Properties and Methods. The Class is for handling Position Tracking, Step Counting and Calculte Distances. The Class can start inverval Tracking and used the Wake Lock API. new GeoTracker() This Method is the Constructor for this Class. Version: 0.1.0 Since: 2026-06-05 Author: Markus Götz Example var objGeoTracker = new GeoTracker(); Methods calcDistance(lat1, lng1, lat2, lng2) This Method calculate the Distance between two Points on the Earth's surface with the Haversine-Formula. Parameters: Name Type Description lat1 number The Latidude of Waypoint 1 (float) lng1 number The Langidude of Waypoint 1 (float) lat2 number The Latidude of Waypoint 2 (float) lng2 number The Langidude of Waypoint 2 (float) Returns: distance The Distance between Waypoint 1 and Waypoint 2 in Meters (float) Type number Example var floatDistance = objGeoTracker.calcDistance( lat1, lng1, lat2, lng2 ); checkPedometerSensor() This Method checked the Permission and start the Pedometer to count the steps. Returns: Type void Example objGeoTracker.checkPedometerSensor(); get(property) This Method is the default getter of the Class. Parameters: Name Type Description property string The Property to get Returns: value The Value of the Property Type mixed Example var value = objGeoTracker.stepCount( property ); getCurrentPosition(callbackSuccess) This Method get the current Position, called the Callback Function and hand over the Position Data. Parameters: Name Type Description callbackSuccess string The Property to set Returns: Type void Example objGeoTracker.getCurrentPosition( callbackSuccess ); set(property, value) This Method is the default setter of the Class. Parameters: Name Type Description property string The Property to set value mixed The Value to set Returns: Type void Example objGeoTracker.set( property, value ); startIntervalTracking(callbackSuccess) This Method start the interval Tracking and get periodically the current Position, called the Callback Function and hand over the Position Data. Parameters: Name Type Description callbackSuccess string The Property to set Returns: Type void Example objGeoTracker.startIntervalTracking( callbackSuccess ); startPedometer() This Method start the Pedometer to count the steps. Returns: Type void Example objGeoTracker.startPedometer(); &lt;async&gt; startWakeLock() This Method starts the Wake Look, so that the Device does not go into Sleep Mode or lock the Screen. Returns: Type void Example objGeoTracker.startWakeLock(); stopIntervalTracking() This Method stop the interval Tracking. Returns: Type void Example objGeoTracker.stopIntervalTracking(); stopWakeLock() This Method stops the Wake Look Mode, the Device can go into Sleep Mode or lock the Screen. Returns: Type void Example objGeoTracker.stopWakeLock(); × Search results Close Documentation generated by JSDoc 4.0.5 on 2026-06-14T09:47:18+02:00 using the DocStrap template. "},"friendshunt.html":{"id":"friendshunt.html","title":"Namespace: friendshunt","body":" Documentation Namespaces friendshunt Classes BatteryTrackerGeoMapsGeoTracker Namespace: friendshunt friendshunt Communication Package for the Friends Hunt App. This Package represents the Communication Package for the Friends Hunt App with his Functions. Version: 0.1.0 Since: 2026-06-06 Author: Markus Götz Copyright: 2026 Markus Götz Methods &lt;static&gt; TimeStringToTimeString(strTime) This Function formats a date-time string to a human readable format. Parameters: Name Type Description strTime string The unformated date-time String Version: 0.1.0 Since: 2026-06-06 To Do: Rename this Function (Lower Camel Case) Returns: strFormattedDate The formatted date-time String Type string Example strFormattedDate = friendshunt.methods.TimeStringToTimeString( strTime ); &lt;static&gt; _validateEmail(strEmail) This Function is a validation Helper Function for validate E-mail Addresses. Parameters: Name Type Description strEmail string The E-Mail Address Form Field Value. Version: 0.1.0 Since: 2026-06-06 Returns: boolFormFieldIsValide The validation result (true = Field Value is Valide, false = Field Value is not Valide). Type boolean Example var boolFormFieldIsValide = friendshunt.methods._validateEmail( strEmail ); &lt;static&gt; _validateField(strKey) This Function is a validation Helper Function and is used to validate a Form Field Value with the given Key from the Field Definition and returns a boolean value. Parameters: Name Type Description strKey string The Form Field Key of the Field Definition. Version: 0.1.0 Since: 2026-06-06 Returns: boolFormIsValide The validation result (true = Field Value is Valide, false = Field Value is not Valide). Type boolean Example var boolFormIsValide = friendshunt.methods._validateField( strKey ); &lt;static&gt; _validateFieldSetFormError() This Function is a validation Helper Function to set or remove a Form Error to the Form Field after a Key Event. Version: 0.1.0 Since: 2026-06-06 Returns: Type void Example friendshunt.methods._validateFieldSetFormError(); &lt;static&gt; _validateFields() This Function is a validation Helper Function and validate the Fields, controlls the other Helper Functions and enable / disable the Submit Buttons. Version: 0.1.0 Since: 2026-06-06 Returns: Type void Example friendshunt.methods._validateFields(); &lt;static&gt; _validatePassword(strPassword) This Function is a validation Helper Function for validate Passoword. Parameters: Name Type Description strPassword string The Passowrd Form Field Value. Version: 0.1.0 Since: 2026-06-06 Returns: boolFormFieldIsValide The validation result (true = Field Value is Valide, false = Field Value is not Valide). Type boolean Example var boolFormFieldIsValide = friendshunt.methods._validatePassword( strPassword ); &lt;static&gt; addCapturedContainer(objStatistics) This Function add the Statistic Container for the captured Player from the Game to the Game Dashboard. Parameters: Name Type Description objStatistics object The Statistic Object with all important Values Version: 0.1.0 Since: 2026-06-06 Returns: Type void Example friendshunt.methods.statistics.addCapturedContainer( objStatistics ); &lt;static&gt; addGameOverviewContainer(objStatistics) This Function add the Overview Statistic Container from the Game to the Game Dashboard. Parameters: Name Type Description objStatistics object The Statistic Object with all important Values Version: 0.1.0 Since: 2026-06-06 Returns: Type void Example friendshunt.methods.statistics.addGameOverviewContainer( objStatistics ); &lt;static&gt; addHunterToGame() This Function register the Event Listener for add a Game Hunter Player to the Game Button on the New Game Page and process the Functions by Click Event. The Function generate and fired the Ajax Request for add Game Hunter Player to the Game (only available for Administrators). The Event Listener registered at Pageload Ready. Version: 0.1.0 Since: 2026-06-06 Returns: Type void Example friendshunt.listener.addHunterToGame(); &lt;static&gt; addManagementToGame() This Function register the Event Listener for add a Game Management Player to the Game Button on the New Game Page and process the Functions by Click Event. The Function generate and fired the Ajax Request for add Game Management Player to the Game (only available for Administrators). The Event Listener registered at Pageload Ready. Version: 0.1.0 Since: 2026-06-06 Returns: Type void Example friendshunt.listener.addManagementToGame(); &lt;static&gt; addMessagesContainer(objStatistics) This Function add the Messages Statistic Container from the Game to the Game Dashboard. Parameters: Name Type Description objStatistics object The Statistic Object with all important Values Version: 0.1.0 Since: 2026-06-06 Returns: Type void Example friendshunt.methods.statistics.addMessagesContainer( objStatistics ); &lt;static&gt; addPlayerDistancesContainers(objStatistics) This Function add Distances and Steps Statistic Container from the Game to the Game Dashboard. Parameters: Name Type Description objStatistics object The Statistic Object with all important Values Version: 0.1.0 Since: 2026-06-06 Returns: Type void Example friendshunt.methods.statistics.addPlayerDistancesContainers( objStatistics ); &lt;static&gt; addPlayerToGame() This Function register the Event Listener for add a Game Player Player to the Game Button on the New Game Page and process the Functions by Click Event. The Function generate and fired the Ajax Request for add Game Player Player to the Game (only available for Administrators). The Event Listener registered at Pageload Ready. Version: 0.1.0 Since: 2026-06-06 Returns: Type void Example friendshunt.listener.addPlayerToGame(); &lt;static&gt; addSpeedHuntsContainer(objStatistics, objResponse) This Function add the Speed Hunt Statistic Container from the Game to the Game Dashboard. Parameters: Name Type Description objStatistics object The Statistic Object with all important Values objResponse object The Response Object of the Ajax Request Version: 0.1.0 Since: 2026-06-06 Returns: Type void Example friendshunt.methods.statistics.addSpeedHuntsContainer( objStatistics, objResponse ); &lt;static&gt; addViolationsOfTheRules(objStatistics, objResponse) This Function add the Violations of the Rules Statistic Container from the Game to the Game Dashboard. Parameters: Name Type Description objStatistics object The Statistic Object with all important Values objResponse object The Response Object of the Ajax Request Version: 0.1.0 Since: 2026-06-06 Returns: Type void Example friendshunt.methods.statistics.addViolationsOfTheRules( objStatistics, objResponse ); &lt;static&gt; cAddGameImagesContent() This Function is called by the Game Dashboard Page and generates the Html Code for the Gameplay Images in the Content Container of the Game Dashboard Page. Version: 0.1.0 Since: 2026-06-06 Returns: Type void Example friendshunt.methods.cAddGameImagesContent(); &lt;static&gt; cAddGameplayDataToTemplate() This Function generate the Html Code from the Game Player Informations (Player, Hunter or Management) and add to the Content of the Game Dashboard. Version: 0.1.0 Since: 2026-06-06 Returns: Type void Example friendshunt.methods.cAddGameplayDataToTemplate(); &lt;static&gt; cAddGamesToTemplate() This Function generate the Html Code from a Game with Game Informations and add the Content to the My Account Page. Version: 0.1.0 Since: 2026-06-06 Returns: Type void Example friendshunt.methods.cAddGamesToTemplate(); &lt;static&gt; cArchiveGame(objElement) This Function generate and called the Ajax Request to archive a Game. Parameters: Name Type Description objElement object The Button was clicked or touched to detect the Game Id Version: 0.1.0 Since: 2026-06-06 Returns: Type void Example friendshunt.methods.cArchiveGame( objElement ); &lt;static&gt; cBringBackArchiveGame(objElement) This Function generate and called the Ajax Request to bring the Game back to the Overview from the Archive of the Administrator Game Archive List. Parameters: Name Type Description objElement object The Button was clicked or touched to detect the Game Id Version: 0.1.0 Since: 2026-06-06 Returns: Type void Example friendshunt.methods.cBringBackArchiveGame( objElement ); &lt;static&gt; cCloseFullImage() This Function close the Image Zoom Layer. Version: 0.1.0 Since: 2026-06-06 Returns: Type void Example friendshunt.methods.cCloseFullImage(); &lt;static&gt; cDeleteArchiveGame(objElement) This Function delete a Game in the Game Archive of the Administrator Game Archive List. Parameters: Name Type Description objElement object The Button was clicked or touched to detect the Game Id Version: 0.1.0 Since: 2026-06-06 Returns: Type void Example friendshunt.methods.cDeleteArchiveGame( objElement ); &lt;static&gt; cDeleteGame(objElement) This Function generate and called the Ajax Request to delete a Game. Parameters: Name Type Description objElement object The Button was clicked or touched to detect the Game Id Version: 0.1.0 Since: 2026-06-06 Returns: Type void Example friendshunt.methods.cDeleteGame( objElement ); &lt;static&gt; cDeletePlayerFromApp(objElement) This Function generate and called the Ajax Request to delete a Player from the Administrator Player List. Parameters: Name Type Description objElement object The Button was clicked or touched to detect the Player Id Version: 0.1.0 Since: 2026-06-06 Returns: Type void Example friendshunt.methods.cDeletePlayerFromApp( objElement ); &lt;static&gt; cGetGameArchiveList() This Function generate and called the Ajax Request to to get all Games in the Archive. Version: 0.1.0 Since: 2026-06-06 Returns: Type void Example friendshunt.methods.cGetGameArchiveList(); &lt;static&gt; cGetPlayerInfoHtml(objPlayer, strInputName) This Function generate the Html Code for a Game Player at the Game Dashboard. Parameters: Name Type Description objPlayer object The Player strInputName string The Input Name Version: 0.1.0 Since: 2026-06-06 Returns: strContentContainerContent The Content to set in the Html Content Type string Example var strContentContainerContent = friendshunt.methods.cGetPlayerInfoHtml( objPlayer, strInputName ); &lt;static&gt; cGetPlayerList() This Function generate and called the Ajax Request to to get all Players. Version: 0.1.0 Since: 2026-06-06 Returns: Type void Example friendshunt.methods.cGetPlayerList(); &lt;static&gt; cMapInfoLayerClose() This Function closed the Map Info Layer on the Game Configuration Page and deleted the Click Event Listener from the GeoMaps Object. Version: 0.1.0 Since: 2026-06-06 Returns: Type void Example friendshunt.methods.cMapInfoLayerClose(); &lt;static&gt; cPlayMessagePiep() This Function is playing the Piep Message Sound. Version: 0.1.0 Since: 2026-06-06 Returns: Type void Example friendshunt.methods.cPlayMessagePiep(); &lt;static&gt; cProccessResponseAddHunterToGame(objResponseObject) This Function Callback Helper Function for the Game Dashboard and add the Game Hunter Players to the Html. Parameters: Name Type Description objResponseObject object The Response Object after the Ajax Request is done Version: 0.1.0 Since: 2026-06-06 Returns: Type void Example friendshunt.methods.cProccessResponseAddHunterToGame( objResponseObject ); &lt;static&gt; cProccessResponseAddManagementToGame(objResponseObject) This Function Callback Helper Function for the Game Dashboard and add the Game Management Players to the Html. Parameters: Name Type Description objResponseObject object The Response Object after the Ajax Request Version: 0.1.0 Since: 2026-06-06 Returns: Type void Example friendshunt.methods.cProccessResponseAddManagementToGame( objResponseObject ); &lt;static&gt; cProccessResponseAddPlayerToGame(objResponseObject) This Function Callback Helper Function for the Game Dashboard and add the Game Players to the Html. Parameters: Name Type Description objResponseObject object The Response Object after the Ajax Request Version: 0.1.0 Since: 2026-06-06 Returns: Type void Example friendshunt.methods.cProccessResponseAddPlayerToGame( objResponseObject ); &lt;static&gt; cProccessResponseArchiveGame(objResponse) This Function is the Callback Function from the Archive Game Ajax Request. Parameters: Name Type Description objResponse object The Response Object after the Ajax Request is done Version: 0.1.0 Since: 2026-06-06 Returns: Type void Example friendshunt.methods.cProccessResponseArchiveGame( objResponse ); &lt;static&gt; cProccessResponseDeleteGame(objResponse) This Function is the Callback Function from the Delete Game Ajax Request. Parameters: Name Type Description objResponse object The Response Object after the Ajax Request is done Version: 0.1.0 Since: 2026-06-06 Returns: Type void Example friendshunt.methods.cProccessResponseArchiveGame( objResponse ); &lt;static&gt; cProccessResponseGameArchiveList(objResponseObject) This Function is the Callback Function from the get All Games from the Archive Ajax Request. The Function generate the Html Content of all Games in the Archiv and set the Content to the Template. Parameters: Name Type Description objResponseObject object The Response Object after the Ajax Request is done Version: 0.1.0 Since: 2026-06-06 Returns: Type void Example friendshunt.methods.cProccessResponseGameArchiveList( objResponseObject ); &lt;static&gt; cProccessResponsePlayerList(objResponseObject) This Function is the Callback Function from the get All App Player Ajax Request. The Function generate the Html Content of all Player and set the Content to the Template. Parameters: Name Type Description objResponseObject object The Response Object after the Ajax Request is done Version: 0.1.0 Since: 2026-06-06 Returns: Type void Example friendshunt.methods.cProccessResponsePlayerList( objResponseObject ); &lt;static&gt; cShowMapInInfoLayer(floatTrackLat, floatTrackLng, floatTrackPrecision, objTrackMessage) This Function add the Map to the Info Layer in the new Game Configuration and registered a click Event Listener to set the Start and Exit Point in the Map. This Function is the Callback Function from the Geo Tracker Object. Parameters: Name Type Description floatTrackLat number The Latitude Coordinate (float) floatTrackLng number The Longitude Coordinate (float) floatTrackPrecision number The Precision in Meters (int) objTrackMessage object The Message of the Geo Tracker Methode Version: 0.1.0 Since: 2026-06-06 Returns: Type void Example friendshunt.methods.cShowMapInInfoLayer( floatTrackLat, floatTrackLng, floatTrackPrecision, objTrackMessage ); &lt;static&gt; cStartGame(objElement) This Function obtains permission to use the motion sensor on iOS devices. And fired a Ajax Request to Server for Start the Game. Parameters: Name Type Description objElement object The Element are clicked Version: 0.1.0 Since: 2026-06-06 Returns: Type void Example friendshunt.methods.cStartGame( objElement ); &lt;static&gt; cTimestampToDateTimeString(intTimestamp) This Function converts a PHP Timestamp to a human readable format. Parameters: Name Type Description intTimestamp number The PHP Timestamp Version: 0.1.0 Since: 2026-06-06 Returns: strFormattedDateTime The formatted date-time String Type string Example strFormattedDateTime = friendshunt.methods.cTimestampToDateTimeString( intTimestamp ); &lt;static&gt; cTriggerMessageVibration() This Function is playing a vibration (not on Iphone). Version: 0.1.0 Since: 2026-06-06 Returns: Type void Example friendshunt.methods.cTriggerMessageVibration(); &lt;static&gt; calcHtmlTags() This Function register the Event Listener to calc in span Html Tags with Css Classes. Version: 0.1.0 Since: 2026-06-06 Returns: Type void Example friendshunt.listener.calcHtmlTags(); &lt;static&gt; changePlayerPassword() This Function register the Event Listener for save a new Password Button on the My Account Edit Page and process the Functions by Click Event. The Function generate and fired the Ajax Request for save a new Password. The Event Listener registered at Pageload Ready. Version: 0.1.0 Since: 2026-06-06 Returns: Type void Example friendshunt.listener.changePlayerPassword(); &lt;static&gt; checkRules() This Function checks the Game Rules and set the window Variable of the Game. Version: 0.1.0 Since: 2026-06-06 Returns: Type void Example friendshunt.methods.gameplay.checkRules(); &lt;static&gt; checkSystemMessages() This Function is checking the System-Messages and show the System Message Layer if a new Message in the Ajax Response. Version: 0.1.0 Since: 2026-06-06 Returns: Type void Example friendshunt.methods.gameplay.checkSystemMessages(); &lt;static&gt; clickOpenMapInLayer() This Function register the Event Listener for click start Position Input Field or the exit Position
