    {"classes.list.html":{"id":"classes.list.html","title":"Classes","body":" Documentation Classes BaseBatteryTrackerCommunicatorGameGameplayGeoMapsGeoTrackerPlayerReplayPlayerStatisticUtilsValidator Classes Classes Base BatteryTracker Communicator Game Gameplay GeoMaps GeoTracker Player ReplayPlayer Statistic Utils Validator × Search results Close Documentation generated by JSDoc 4.0.5 on 2026-06-21T08:49:52+02:00 using the DocStrap template. "},"index.html":{"id":"index.html","title":"Index","body":" Documentation Classes BaseBatteryTrackerCommunicatorGameGameplayGeoMapsGeoTrackerPlayerReplayPlayerStatisticUtilsValidator × Search results Close Documentation generated by JSDoc 4.0.5 on 2026-06-21T08:49:52+02:00 using the DocStrap template. "},"Base.html":{"id":"Base.html","title":"Class: Base","body":" Documentation Classes BaseBatteryTrackerCommunicatorGameGameplayGeoMapsGeoTrackerPlayerReplayPlayerStatisticUtilsValidator Class: Base Base This is the base class for the players and the games. This class represents the base class from which other classes are derived. The class contains all the necessary properties and methods that are necessary for derived classes. The class does not require any parameters for instantiation. This class requires the Communicator class. new Base() This method is the constructor of the class. Version: 0.1.0 Since: 2026-06-18 Author: Markus Götz Returns: Type void Example const baseObject = new Base(); Methods get(property) This method is the default getter of the class and the derived class. Parameters: Name Type Description property string The property of the value Returns: value The value of the property Type mixed Examples let value = baseObject.get( property ); let value = this.get( property ); processResponse(response) This method receives the response from the Communicator class and sets the class variables and executes the method of the class that was specified as a callbackMethod in the request. Parameters: Name Type Description response object The response of the query from the Communicator class Returns: Type void Examples baseObject.processResponse( response ); this.processResponse( response ); registerEventHandler() This method registers all event handlers that are necessary for the class. The method should be executed by the derived classes. Returns: Type void Examples baseObject.registerEventHandler(); this.registerEventHandler(); set(property, value) This method is the default setter for the class and the derived classes. Parameters: Name Type Description property string The property that you want to set value mixed The value you want to set to the property Returns: Type void Examples baseObject.set( property, value ); this.set( property, value ); unhideGameAdministratorButtons() This method shows the buttons for which the user has the rights. This method hides all other buttons. Returns: Type void Examples baseObject.unhideGameAdministratorButtons(); this.unhideGameAdministratorButtons(); × Search results Close Documentation generated by JSDoc 4.0.5 on 2026-06-21T08:49:52+02:00 using the DocStrap template. "},"BatteryTracker.html":{"id":"BatteryTracker.html","title":"Class: BatteryTracker","body":" Documentation Classes BaseBatteryTrackerCommunicatorGameGameplayGeoMapsGeoTrackerPlayerReplayPlayerStatisticUtilsValidator Class: BatteryTracker BatteryTracker Geo Battery Class for the Friends Hunt App. This Class represents the Battery Tracker Class for the Friends Hunt App with his Properties and Methods. The Class is for handling Battery Level and is charging. Unfortunately, accessing the battery does not work on the iPhone. new BatteryTracker() This method is the constructor of the class. Version: 0.1.0 Since: 2026-06-05 Author: Markus Götz Returns: Type void Example const objBatteryTracker = new BatteryTracker(); Methods get(property) This Method is the default getter of the Class. Parameters: Name Type Description property string The Property to get Returns: value The Value of the Property Type mixed Example let value = objBatteryTracker.get( property ); getBatteryData() This Method returns the current Battery State with Battery Level and is the Battery curren charging. Returns: objBatteryState objBatteryState Type object Example const objBatteryState = objBatteryTracker.getBatteryData(); init() This Method initializes the Battery API and binds the event listeners. Returns: objPromise Returns a promise once initialization is complete Type Promise Example const objPromise = objBatteryTracker.init(); set(property, value) This Method is the default setter of the Class. Parameters: Name Type Description property string The Property to set value mixed The Value to set Returns: Type void Example objBatteryTracker.set( property, value ); updateBatteryData() This Method updates the internal properties when the API fires an event. The Method is the Callback Function of the init Method. Returns: Type void Example objBatteryTracker.updateBatteryData(); × Search results Close Documentation generated by JSDoc 4.0.5 on 2026-06-21T08:49:52+02:00 using the DocStrap template. "},"Communicator.html":{"id":"Communicator.html","title":"Class: Communicator","body":" Documentation Classes BaseBatteryTrackerCommunicatorGameGameplayGeoMapsGeoTrackerPlayerReplayPlayerStatisticUtilsValidator Class: Communicator Communicator This communication class for the app. All requests go through this class. The class contains all required properties and methods. The class requires the Validator class. new Communicator() This method is the constructor of the class. Version: 0.1.0 Since: 2026-06-18 Author: Markus Götz Returns: Type void Example const communicator = new Communicator(); Methods _request(request) This method executes the actual Xhr request. All the necessary parameters are in the request object. The response of this method is passed to the processResponse method. Parameters: Name Type Description request object The request object with all the required information Returns: Type void Examples communicator._request( request ); this._request( request ); get(property) This method is the default getter of the class and the derived class. Parameters: Name Type Description property string The property of the value Returns: value The value of the property Type mixed Examples let value = communicator.get( 'maxRequestCount' ); let value = this.get( property ); manageRedirects(redirect) This method redirects to a redirect url if desired Parameters: Name Type Description redirect string The Redirect Url Returns: Type void Examples communicator.manageRedirects( '?view=Game' ); this.manageRedirects( redirect ); manageRequestQueue() This method controls the request queue. The method passes the request objects one after the other to the _request method until a current request has been processed. Returns: Type void Examples communicator.manageRequestQueue(); this.manageRequestQueue(); newJsonRequestObject(className, method, id) This method returns a request object for the Commicator to which you can attach further data. Parameters: Name Type Description className string The class name of the object method string The method to be executed on the server id string The ID of the object on which the method should be executed Returns: requestObject The finished request object for the communicator Type object Examples const requestObject = communicator.newJsonRequestObject( 'Player', 'deletePlayer', 'max@musterman.de' ); const requestObject = this.newJsonRequestObject( className, method, id ); proccessResponse(request, response) This method takes the response from the request, checks for errors, and forwards it to a redirect if desired and passes the response information to the callback method. Parameters: Name Type Description request object The request object that was sent to the endpoint response object The response object that came back from the endpoint and is passed on to the callback method Returns: Type void Examples communicator.proccessResponse( request, response ); this.proccessResponse( request, response ); request(method, getParams, postParams, callbackMethod) This method receives the request objects, prepares them and pushes them into the request queue. Parameters: Name Type Description method string The method in which the data should be sent to the endpoint getParams object All parameters that should be appended to the Url as Url parameters postParams object All parameters that should be sent as post parameters (the request object) callbackMethod function The callback method to which the response data should be passed Returns: Type void Examples communicator.request( 'POST', {}, {}, ref.function ); this.request( 'method', getParams, postParams, callbackMethod ); set(property, value) This method is the default setter for the class and the derived classes. Parameters: Name Type Description property string The property that you want to set value mixed The value you want to set to the property Returns: Type void Examples communicator.set( 'property', 5 ); this.set( property, value ); setFields(object) The response object contains an object that is compatible with the currently accessed page these input Html fields are set from the object. Parameters: Name Type Description object object The object from the response from the endpoint Returns: Type void Examples communicator.setFields( object ); this.setFields( object ); × Search results Close Documentation generated by JSDoc 4.0.5 on 2026-06-21T08:49:52+02:00 using the DocStrap template. "},"Game.html":{"id":"Game.html","title":"Class: Game","body":" Documentation Classes BaseBatteryTrackerCommunicatorGameGameplayGeoMapsGeoTrackerPlayerReplayPlayerStatisticUtilsValidator Class: Game Game The Game class manages the individual games and contains all the required properties, methods and event handlers. This class requires the GeoTracker class, the GeoMaps class and inherits from the Base class. The Game class registers all required event handlers when instantiating. new Game() This method is the constructor of the class. Version: 0.1.0 Since: 2026-06-18 Author: Markus Götz Returns: Type void Example const game = new Game(); Methods addGameImagesContent() This method inserts the images of a game into the designated location on the dashboard. Returns: Type void Examples game.addGameImagesContent(); this.addGameImagesContent(); addGameplayDataToTemplate() This method fetches the individual players from the end point and inserts them in their roles into the game dashboard in the designated places. Returns: Type void Examples game.addGameplayDataToTemplate(); this.addGameplayDataToTemplate(); bringBackArchiveGame(element) This method fires a request to the endpoint via the Communicator object to bring an archived game back to the dashboard. Parameters: Name Type Description element object The element (button) that was clicked to find out the game ID Returns: Type void Examples game.bringBackArchiveGame( element ); this.bringBackArchiveGame( element); deleteArchiveGame(element) This method creates a Request object and fires it via the Communicator object to the endpoint for a game which is in the archive to be deleted. Parameters: Name Type Description element object The element (button) that was clicked to find out the game ID Returns: Type void Examples game.deleteArchiveGame( element ); this.deleteArchiveGame( element ); getGameArchiveList() This method fires a request to the endpoint to get the data of the archived games. The response of this method is passed from the Communictor object to the proccessResponseGameArchiveList. Returns: Type void Examples game.getGameArchiveList(); this.getGameArchiveList(); proccessResponseGameArchiveList(response) This method prepares the response information from the getGameArchiveList request and Adds the archived games to the archive list at the designated location. Parameters: Name Type Description response object The response object from the endpoint Returns: Type void Examples game.proccessResponseGameArchiveList( response ); this.proccessResponseGameArchiveList( response ); registerEventListener() This method registers all event handlers that are necessary for the class. The method is called when instantiating a Game object. The method also calls the Super method of the Base Object. Returns: Type void Examples game.registerEventHandler(); this.registerEventHandler(); showMapInInfoLayer(lat, lng, precision, message) This method shows a game's map, markers, and board in one layer. Parameters: Name Type Description lat number The latitude of a point on the map (starting point, exit point or center of the playing field) lng number The longitude of a point on the map (start point, exit point, or the center of the playing field) precision number The precision in meters, which indicates the accuracy of the latitude and longitude message object A message (not currently used) Returns: Type void Examples game.showMapInInfoLayer(); this.showMapInInfoLayer(); startGame() This method starts a game and sends all the required information to the endpoint. The response returns the game settings and the game status. Returns: Type void Examples game.startGame(); this.startGame(); × Search results Close Documentation generated by JSDoc 4.0.5 on 2026-06-21T08:49:52+02:00 using the DocStrap template. "},"Gameplay.html":{"id":"Gameplay.html","title":"Class: Gameplay","body":" Documentation Classes BaseBatteryTrackerCommunicatorGameGameplayGeoMapsGeoTrackerPlayerReplayPlayerStatisticUtilsValidator Class: Gameplay Gameplay The Gameplay class controls the game with all the options the game offers. This method requires the Communicator class, the GeoTracker class, the GeoMaps class, the Game class and the Battery Tracker class. The class controls the Silent Hunts, the Speed Hunts, fires the tracking to the end point, counts steps and monitors the device's battery level. new Gameplay(playerId, gameId, gameSettings) This method is the constructor of the class. Parameters: Name Type Description playerId string The current player's ID gameId string The Game ID of the game to be played gameSettings object The Game Settings object with all of the game's settings Version: 0.1.0 Since: 2026-06-18 Author: Markus Götz Returns: Type void Example const gameplay = new Gameplay( playerId, gameId, gameSettings ); Methods checkRules() This method checks the game rules based on the player's game settings. Returns: Type void Examples gameplay.checkRules(); this.checkRules(); checkSystemMessages() This method checks whether new system messages have been received and displays them to the player in a layer. if there are new system messages, the player will be alerted with a beep a vibrator is triggered on Android cell phones. Returns: Type void Examples gameplay.checkSystemMessages(); this.checkSystemMessages(); generateReplayData(response) This method is the callback method from the getReplayData method. The method creates a replay object in which the tracking of all players is in an array sorted by timestamp. After the Replay object is created, this method calls the startReplayPlayer method to start the Replay Player. Parameters: Name Type Description response object The response object from the endpoint with the tracking data Returns: Type void Examples gameplay.generateReplayData( response ); this.generateReplayData( response ); get(property) This method is the default getter of the class. Parameters: Name Type Description property string The property of the value Returns: value The value of the property Type mixed Examples let value = gameplay.get( property ); let value = this.get( property ); getReplayData() This method creates a Request Object for fetching the complete tracking data for the current game and fires it to the endpoint via the Communicator Object. The callback method that processes the response is the generateReplayData method. The request is only generated if there is no tracking data on the object yet, otherwise the ReplayPlayer is instantiated using the startReplayPlayer method. Returns: Type void Examples gameplay.getReplayData(); this.getReplayData(); init() This method initializes the object and is called when instantiated from the class. The method sets the position of the card, starts interval tracking and starts wake lock. Returns: Type void Examples gameplay.init(); this.init(); processResponse(response) This method controls the callback methods from the endpoint requests and passes them Response data to the respective callback method. Parameters: Name Type Description response object The Response object returned by the Communicator object Returns: Type void Examples gameplay.processResponse( response ); this.processResponse( response ); registerEventHandler() This method registers all required event handlers of the game. The method is called when instantiating an object via the init method. Returns: Type void Examples gameplay.registerEventHandler(); this.registerEventHandler(); sendCaptured() This method creates a request object with the information that you were caught and who caught you. This request object is fired to the endpoint via the Communcator object. Returns: Type void Examples gameplay.sendCaptured(); this.sendCaptured(); set(property, value) This method is the default setter for the class. Parameters: Name Type Description property string The property that you want to set value mixed The value you want to set to the property Returns: Type void Examples gameplay.set( property, value ); this.set( property, value ); setMap(lat, lng, precision, message) This method sets the map over the GeoMaps object such as the start point, the exit point and the playing field. Parameters: Name Type Description lat number The latitude of a point on the map (starting point, exit point or center of the playing field) lng number The longitude of a point on the map (start point, exit point, or the center of the playing field) precision number The precision in meters, which indicates the accuracy of the latitude and longitude message object A message (not currently used) Returns: Type void Examples gameplay.setMap( lat, lng, precision, message ); this.setMap( lat, lng, precision, message ); setMessages() This method places the messages in the message layer and scrolls to the end of the message list. Returns: Type void Examples gameplay.setMessages(); this.setMessages(); setPosition(gameplayRole, tracking, playerCount) This method sets the positions of each player on the map and populates the popup of players on the map with all necessary information. Parameters: Name Type Description gameplayRole string The player role in the game (player, hunter or game leader) tracking object The current tracking object with all important information and movement data playerCount number The player number if the player names should not be displayed Returns: Type void Examples gameplay.setPosition( gameplayRole, tracking, playerCount ); this.setPosition( gameplayRole, tracking, playerCount ); setPositions(response) This method evaluates the response from the end point and controls all other methods that set the positions of the players on the map, displays messages and system messages, updates the status bar and checks the game rules. Parameters: Name Type Description response object The response object with all currently important information about the game Returns: Type void Examples gameplay.setPositions( response ); this.setPositions( response ); setStateLine() This method sets the status line in the game with all currently important information. Important information includes, for example, when the next Silent Hunt is, whether there is a Speed Hunt is running or when this is possible. Returns: Type void Examples gameplay.setStateLine(); this.setStateLine(); setStates() This method sets different states to the current gameplay. The method is executed when the class is instantiated and with every response. Returns: Type void Examples gameplay.setStates(); this.setStates(); showCaptureLayer() This method shows the captured layer in the game with all selectable Hunters. Returns: Type void Examples gameplay.showCaptureLayer(); this.showCaptureLayer(); showMessageLayer() This method opens or closes the player's message layer. Returns: Type void Examples gameplay.showMessageLayer(); this.showMessageLayer(); speedHunt(speedHuntPlayerId) This method creates a request object for a speed hunt and fires it to the endpoint via the communicator object. The method can only be used by hunters. Parameters: Name Type Description speedHuntPlayerId string The Player ID to which the Speed ​​Hunt Ping should be fired Returns: Type void Examples gameplay.speedHunt( 'max@musterman.de' ); this.speedHunt( speedHuntPlayerId ); startReplayPlayer() This method instantiates the ReplayPlayer and removes the hidden Css class from the Replay Player panel. Returns: Type void Examples gameplay.startReplayPlayer(); this.startReplayPlayer(); timestampNow() This method returns a Php timestamp of the current time. Returns: timestampNow The Php timestamp at the current time Type number Examples let timestampNow = gameplay.timestampNow(); let timestampNow = this.timestampNow(); track(lat, lng, precision, message) This method creates a tracking object with longitude, longitude, number of steps, battery level and some more and sends this tracking object to the endpoint via the Communicator object. Der Response geht an die setPositions Methode um dort verarbeitet zu werden. Parameters: Name Type Description lat number The latitude of a point on the map (starting point, exit point or center of the playing field) lng number The longitude of a point on the map (start point, exit point, or the center of the playing field) precision number The precision in meters, which indicates the accuracy of the latitude and longitude message object A message (not currently used) Returns: Type void Examples gameplay.track( lat, lng, precision, message ); this.track( lat, lng, precision, message ); × Search results Close Documentation generated by JSDoc 4.0.5 on 2026-06-21T08:49:52+02:00 using the DocStrap template. "},"GeoMaps.html":{"id":"GeoMaps.html","title":"Class: GeoMaps","body":" Documentation Classes BaseBatteryTrackerCommunicatorGameGameplayGeoMapsGeoTrackerPlayerReplayPlayerStatisticUtilsValidator Class: GeoMaps GeoMaps Geo Maps Class for the Friends Hunt App. This Class represents the Geo Maps Class for the Friends Hunt App with his Properties and Methods. The Class is for handling Leaflet with OpenStreetMap. new GeoMaps() This Method is the Constructor for this Class. Version: 0.1.0 Since: 2026-06-05 Author: Markus Götz Example const objGeoMaps = new GeoMaps(); Methods addMarkerCssClass(id, cssClass) This Method add a css Class to a Marker Icon. Parameters: Name Type Description id string The Game Player Id (Marker Id) cssClass string The css Class to add the Marker Icon Returns: Type void Example objGeoMaps.addMarkerCssClass( id, cssClass ); bindResizeEvents(id, selectorRadius) This Method is a Helper Method to bind Event Listener for Drag and Drop to set the circle radius on the Map interactive. Parameters: Name Type Description id string The Game Player Id (Circle Id) selectorRadius number The Selector of a input Fiel to set the radius Returns: Type void Example objGeoMaps.bindResizeEvents( id, selectorRadius ); containsMarkerCssClass(id, cssClass) This Method check a Marker Icon whether contains a css Class. Parameters: Name Type Description id string The Game Player Id (Marker Id) cssClass string The css Class to remove from the Marker Icon Returns: objResult Contains the css Class at the Marker Icon Type bool Example objResult = objGeoMaps.containsMarkerCssClass( id, cssClass ); get(property) This Method is the default getter of the Class. Parameters: Name Type Description property string The Property to get Returns: value The Value of the Property Type mixed Example let value = objGeoMaps.get( property ); getDistance(id1, id2) This Method return the calculated distance between two Ids in Meters. Parameters: Name Type Description id1 string The Id1 id2 string The Id2 Returns: floatDistance The distance between two Ids in Meters Type number Example floatDistance = objGeoMaps.getDistance( id1, id2 ); getIcon(role, color, name) This Method returns a Icon Vector Object for the Game Player Role. Parameters: Name Type Description role string The Game Player Role (player, hunter or management) color string The Game Player Color name string The Text at the Icon Returns: strImage The Vector Object Image Type string Example strImage = objGeoMaps.getIcon( role, color, name ); getPosition(id) This Method return the Position Object of a Id. Parameters: Name Type Description id string The Id Returns: objPosition The Leaflet Position Object Type object Example objPosition = objGeoMaps.getPosition( id ); removeMarker(id) This Method remove a Marker from the Map. Parameters: Name Type Description id string The Game Player Id to remove from Map Returns: Type void Example objGeoMaps.removeMarker( id ); removeMarkerCssClass(id, cssClass) This Method remove a css Class from a Marker Icon. Parameters: Name Type Description id string The Game Player Id (Marker Id) cssClass string The css Class to remove from the Marker Icon Returns: Type void Example objGeoMaps.removeMarkerCssClass( id, cssClass ); set(property, value) This Method is the default setter of the Class. Parameters: Name Type Description property string The Property to set value mixed The Value to set Returns: Type void Example objGeoMaps.set( property, value ); setCircle(id, lat, lng, size, color, weight, fillColor, opacity) This Method set a circle on the Map. Parameters: Name Type Description id string The Game Player Id (Circle Id) lat number The Latidude of the Center of the Circle lng number The Langidude of the Center of the Circle size number The Radius of the Circle color string The Color of the Circle edge weight number The weight of the Corcle edge fillColor string The fill Color of the Circle opacity number The Opacity of the Circle Returns: Type void Example objGeoMaps.setCircle( id, lat, lng, size, color, weight, fillColor, opacity ); setCircleInteractive(id, size, color, weight, fillColor, opacity, selector, selectorRadius) This Method set a circle on the Map interactive with click to the Map. Parameters: Name Type Description id string The Game Player Id (Circle Id) size number The Radius of the Circle color string The Color of the Circle edge weight number The weight of the Corcle edge fillColor string The fill Color of the Circle opacity number The Opacity of the Circle selector number The Selector of a input Fiel to set the coordinates selectorRadius number The Selector of a input Fiel to set the radius Returns: Type void Example objGeoMaps.setCircleInteractive( id, size, color, weight, fillColor, opacity, selector, selectorRadius ); setIcon(id, role, color, name) This Method set a new Icon on the Marker. Parameters: Name Type Description id string The Game Player Id (Marker Id) role string The Game Player Role (player, hunter or management) color string The Game Player Color name string The Text at the Icon Returns: Type void Example objGeoMaps.setIcon( id, role, color, name ); setMap(lat, lng) This Method set the Map in the Page. Parameters: Name Type Description lat number The current Latidude lng number The current Langidude Returns: objMap The Leaflet Map Object Type object Example let objMap = objGeoMaps.setMap( lat, lng ); setMarker(id, role, color, lat, lng, content, name, cssclass) This Method set a Marker with Popup on the Map. Parameters: Name Type Description id string The Game Player Id (Marker Id) role string The Game Player Role (player, hunter or management) color string The Game Player Color lat number The Latidude of the Game Player lng number The Langidude of the Game Player content string The Content of the Popup name string The Text at the Icon cssclass string The css Class for the Icon Returns: Type void Example objGeoMaps.setMarker( id, role, color, lat, lng, content, name ); setMarkerInteractive(id, role, color, content, selector) This Method set a Marker with Popup interactive with click on the Map. Parameters: Name Type Description id string The Game Player Id (Marker Id) role string The Game Player Role (player, hunter or management) color string The Game Player Color content string The Content of the Popup selector string The Selector of a input Fiel to set the coordinates Returns: Type void Example objGeoMaps.setMarkerInteractive( id, role, color, content, selector ); × Search results Close Documentation generated by JSDoc 4.0.5 on 2026-06-21T08:49:52+02:00 using the DocStrap template. "},"GeoTracker.html":{"id":"GeoTracker.html","title":"Class: GeoTracker","body":" Documentation Classes BaseBatteryTrackerCommunicatorGameGameplayGeoMapsGeoTrackerPlayerReplayPlayerStatisticUtilsValidator Class: GeoTracker GeoTracker Geo Tracker Class for the Friends Hunt App. This Class represents the Geo Tracker Class for the Friends Hunt App with his Properties and Methods. The Class is for handling Position Tracking, Step Counting and Calculte Distances. The Class can start inverval Tracking and used the Wake Lock API. new GeoTracker() This Method is the Constructor for this Class. Version: 0.1.0 Since: 2026-06-05 Author: Markus Götz Example const objGeoTracker = new GeoTracker(); Methods calcDistance(lat1, lng1, lat2, lng2) This Method calculate the Distance between two Points on the Earth's surface with the Haversine-Formula. Parameters: Name Type Description lat1 number The Latidude of Waypoint 1 (float) lng1 number The Langidude of Waypoint 1 (float) lat2 number The Latidude of Waypoint 2 (float) lng2 number The Langidude of Waypoint 2 (float) Returns: distance The Distance between Waypoint 1 and Waypoint 2 in Meters (float) Type number Example let floatDistance = objGeoTracker.calcDistance( lat1, lng1, lat2, lng2 ); checkPedometerSensor() This Method checked the Permission and start the Pedometer to count the steps. Returns: Type void Example objGeoTracker.checkPedometerSensor(); get(property) This Method is the default getter of the Class. Parameters: Name Type Description property string The Property to get Returns: value The Value of the Property Type mixed Example let value = objGeoTracker.stepCount( property ); getCurrentPosition(callbackSuccess) This Method get the current Position, called the Callback Function and hand over the Position Data. Parameters: Name Type Description callbackSuccess string The Property to set Returns: Type void Example objGeoTracker.getCurrentPosition( callbackSuccess ); set(property, value) This Method is the default setter of the Class. Parameters: Name Type Description property string The Property to set value mixed The Value to set Returns: Type void Example objGeoTracker.set( property, value ); startIntervalTracking(callbackSuccess) This Method start the interval Tracking and get periodically the current Position, called the Callback Function and hand over the Position Data. Parameters: Name Type Description callbackSuccess string The Property to set Returns: Type void Example objGeoTracker.startIntervalTracking( callbackSuccess ); startPedometer() This Method start the Pedometer to count the steps. Returns: Type void Example objGeoTracker.startPedometer(); &lt;async&gt; startWakeLock() This Method starts the Wake Look, so that the Device does not go into Sleep Mode or lock the Screen. Returns: Type void Example objGeoTracker.startWakeLock(); stopIntervalTracking() This Method stop the interval Tracking. Returns: Type void Example objGeoTracker.stopIntervalTracking(); stopWakeLock() This Method stops the Wake Look Mode, the Device can go into Sleep Mode or lock the Screen. Returns: Type void Example objGeoTracker.stopWakeLock(); × Search results Close Documentation generated by JSDoc 4.0.5 on 2026-06-21T08:49:52+02:00 using the DocStrap template. "},"Player.html":{"id":"Player.html","title":"Class: Player","body":" Documentation Classes BaseBatteryTrackerCommunicatorGameGameplayGeoMapsGeoTrackerPlayerReplayPlayerStatisticUtilsValidator Class: Player Player This class represents the player class with all the necessary properties, methods and event handlers. The class inherits from the Base class. new Player(playerId) This method is the constructor of the class. Parameters: Name Type Description playerId string The player ID Version: 0.1.0 Since: 2026-06-18 Author: Markus Götz Returns: Type void Example const player = new Player( playerId ); Methods addGamesToTemplate() This method adds a player's games to the designated location in the player dashboard view. Returns: Type void Examples player.addGamesToTemplate(); this.addGamesToTemplate(); archiveGame(element) This method creates a request object to archive a game and fires it to the endpoint via the Communicator object. The callback method is the proccessResponseArchiveGame method. Parameters: Name Type Description element object The element (button) that was clicked to find out the game ID Returns: Type void Examples player.archiveGame( element ); this.archiveGame( element ); deleteGame(element) This method creates a request object to delete a game in the player dashboard view. The Request object is fired to the endpoint via the Communicator object. The callback method for this request is the proccessResponseDeleteGame method. Parameters: Name Type Description element object The element (button) that was clicked to find out the game ID Returns: Type void Examples player.deleteGame( element ); this.deleteGame( element ); deletePlayerFromApp(element) This method creates a Request object to delete the current player and fires it to the endpoint via the Communicator object. Parameters: Name Type Description element object The element (button) that was clicked to find out the player ID Returns: Type void Examples player.deletePlayerFromApp( element ); this.deletePlayerFromApp( element ); getPlayerInfoHtml(player, inputName) This method is the callback method and adds a player or a hunter or a manager in the game configuration view to the for it add designated location. Parameters: Name Type Description player object The player object to be added inputName string The input field name in which the player email address was entered Returns: Type void Examples player.getPlayerInfoHtml( player, inputName ); this.getPlayerInfoHtml( player, inputName ); getPlayerList() This method creates a Request object to fetch the players of a game and fires it to the endpoint via the Communicator object. The callback method is the proccessResponsePlayerList method which further processes the player data. Returns: Type void Examples player.getPlayerList(); this.getPlayerList(); proccessResponseAddHunterToGame(response) This method is the callback method and adds a hunter in the game configuration view to the for it add designated location. Parameters: Name Type Description response object The Response object returned by the Communicator object Returns: Type void Examples player.proccessResponseAddHunterToGame( response ); this.proccessResponseAddHunterToGame( response ); proccessResponseAddManagementToGame(response) This method is the callback method and adds a manager in the game configuration view to the for it add designated location. Parameters: Name Type Description response object The Response object returned by the Communicator object Returns: Type void Examples player.proccessResponseAddManagementToGame( response ); this.proccessResponseAddManagementToGame( response ); proccessResponseAddPlayerToGame(response) This method is the callback method and adds a player in the game configuration view to the for it add designated location. Parameters: Name Type Description response object The Response object returned by the Communicator object Returns: Type void Examples player.proccessResponseAddPlayerToGame( response ); this.proccessResponseAddPlayerToGame( response ); proccessResponseArchiveGame(response) This method is the callback method of the archiveGame method and updates the games in the player dashboard view. Parameters: Name Type Description response object The Response object returned by the Communicator object Returns: Type void Examples player.proccessResponseArchiveGame( response ); this.proccessResponseArchiveGame( response ); proccessResponseDeleteGame(response) This method is the callback method from the deleteGame method and updates the games in the player dashboard view. Parameters: Name Type Description response object The Response object returned by the Communicator object Returns: Type void Examples player.proccessResponseDeleteGame( response ); this.proccessResponseDeleteGame( response ); proccessResponsePlayerList(response) This method is the callback method of the getPlayerList method and sets the players, hunters and game management in the designated place when creating a new game. Parameters: Name Type Description response object The Response object returned by the Communicator object To Do: Player avatar must be fetched by the player and not saved in the games folder. Returns: Type void Examples player.proccessResponsePlayerList( response ); this.proccessResponsePlayerList( response ); registerEventHandler() This method registers all event handlers that are necessary for the class. The method is called when instantiating a Player object. The method also calls the Super method of the Base Object. Returns: Type void Examples player.registerEventHandler(); this.registerEventHandler(); startGame(element) This method starts a selected game from the player dashboard view. Parameters: Name Type Description element element The element (button) that was clicked to find out the game ID Returns: Type void Examples player.startGame( element ); this.startGame( element ); × Search results Close Documentation generated by JSDoc 4.0.5 on 2026-06-21T08:49:52+02:00 using the DocStrap template. "},"ReplayPlayer.html":{"id":"ReplayPlayer.html","title":"Class: ReplayPlayer","body":" Documentation Classes BaseBatteryTrackerCommunicatorGameGameplayGeoMapsGeoTrackerPlayerReplayPlayerStatisticUtilsValidator Class: ReplayPlayer ReplayPlayer This class represents the ReplayPlayer class with all necessary properties, methods and event handlers. The Replay class uses the tracking data to create a replay of all players on the map at multiple speeds. new ReplayPlayer(trackingData, gamePlay) This method is the constructor of the class. Parameters: Name Type Description trackingData object The sorted tracking data gamePlay object The calling gameplay object Version: 0.1.0 Since: 2026-06-18 Author: Markus Götz Returns: Type void Example const replayPlayer = new ReplayPlayer( replayData, gamePlay ); Methods calculateIntermediatePoint(playerId, targetTimestamp) This method gets the players' positions from the tracking data and calculates intermediate positions around jumping to prevent the individual positions. The method returns the position or intermediate position. Parameters: Name Type Description playerId string The player ID for which the position or intermediate position should be calculated targetTimestamp number The timestamp of the time at which the players' markers should be placed Returns: position An object with the position or intermediate position of a player Type object Examples position = replayPlayer.calculateIntermediatePoint( playerId, targetTimestamp ); position = this.calculateIntermediatePoint( playerId, targetTimestamp ); get(property) This method is the default getter of the class. Parameters: Name Type Description property string The property of the value Returns: value The value of the property Type mixed Examples let value = replayPlayer.get( property ); let value = this.get( property ); init() This class initializes the object and registers all required event handlers Returns: Type void Examples replayPlayer.init(); this.init(); pause() This method pauses the replay on the map at the current location. Returns: Type void Examples replayPlayer.pause(); this.pause(); play() This method starts the replay on the map with all players at multiple speeds. Returns: Type void Examples replayPlayer.play(); this.play(); renderTargetTime(targetTimestamp) This method renders the players' positions on the map and sets the players' markers. Parameters: Name Type Description targetTimestamp number The timestamp of the time at which the players' markers should be placed Returns: Type void Examples replayPlayer.renderTargetTime( targetTimestamp ); this.renderTargetTime( targetTimestamp ); set(property, value) This method is the default setter for the class. Parameters: Name Type Description property string The property that you want to set value mixed The value you want to set to the property Returns: Type void Examples replayPlayer.set( property, value ); this.set( property, value ); toggleButtonClass(activeBtn, strInactiveBtnId) This method switches the HTML button objects for playing and pausing the replay active or inactive Parameters: Name Type Description activeBtn object The currently active Html button object which should become inactive strInactiveBtnId object The currently inactive Html button object that should become active Returns: Type void Examples position = replayPlayer.toggleButtonClass( activeBtn, strInactiveBtnId ); position = this.toggleButtonClass( activeBtn, strInactiveBtnId ); × Search results Close Documentation generated by JSDoc 4.0.5 on 2026-06-21T08:49:52+02:00 using the DocStrap template. "},"Statistic.html":{"id":"Statistic.html","title":"Class: Statistic","body":" Documentation Classes BaseBatteryTrackerCommunicatorGameGameplayGeoMapsGeoTrackerPlayerReplayPlayerStatisticUtilsValidator Class: Statistic Statistic This class represents the statistics class with all required properties and methods. The statistics class parses the tracking data, generates statistics from it and appends them in the designated places in the game dashboard view. This class requires the GeoTracker class and the Communicator class. new Statistic(selector) This method is the constructor of the class. Parameters: Name Type Description selector string The Css selector where the statistics should be inserted Version: 0.1.0 Since: 2026-06-18 Author: Markus Götz Returns: Type void Example const statistic = new Statistic( selector ); Methods addCapturedContainer() This method generates the overview container for captured players and inserts it into the designated locations in the game dashboard view. Returns: Type void Examples statistic.addCapturedContainer(); this.addCapturedContainer(); addGameOverviewContainer() This method generates the game overview container and inserts it into the designated locations in the game dashboard view. Returns: Type void Examples statistic.addGameOverviewContainer(); this.addGameOverviewContainer(); addMessagesContainer() This method generates the news overview container and inserts it into the designated locations in the game dashboard view. Returns: Type void Examples statistic.addMessagesContainer(); this.addMessagesContainer(); addOutOfPlayfield() This method generates the Out of Field / Rule Breaking container and inserts it into the designated locations in the Game Dashboard view. Returns: Type void Examples statistic.addOutOfPlayfield(); this.addOutOfPlayfield(); addPlayerDistancesContainers() This method generates the overview container for the distances and steps taken by the players and inserts it into the designated places in the game dashboard view. Returns: Type void Examples statistic.addPlayerDistancesContainers(); this.addPlayerDistancesContainers(); addSpeedHuntsContainer() This method generates the game Speed ​​Hunt container and inserts it into the designated locations in the game dashboard view. Returns: Type void Examples statistic.addSpeedHuntsContainer(); this.addSpeedHuntsContainer(); gameStatistic() This method generates a tracking object from the players' existing tracking data with which the other methods can work better and returns it. Returns: statistic The created Statistic object Type object Examples let statistic = statistic.gameStatistic(); let statistic = this.gameStatistic(); generateGameStatistics(response) This method controls the generation of statistics and is the callback method from the getGameStatistics method. Parameters: Name Type Description response object The Response object returned by the Communicator object Returns: Type void Examples statistic.generateGameStatistics( response ); this.generateGameStatistics( response ); get(property) This method is the default getter of the class. Parameters: Name Type Description property string The property of the value Returns: value The value of the property Type mixed Examples let value = statistic.get( property ); let value = this.get( property ); getGameStatistics() This method creates a request object to fetch the tracking data and fires it to the endpoint via the Communicator object. The callback method is the generateGameStatistics method. Returns: Type void Examples statistic.getGameStatistics(); this.getGameStatistics(); init() This method initializes the statistics object. The method is executed when the class is instantiated. Returns: Type void Examples statistic.init(); this.init(); set(property, value) This method is the default setter for the class. Parameters: Name Type Description property string The property that you want to set value mixed The value you want to set to the property Returns: Type void Examples statistic.set( property, value ); this.set( property, value ); × Search results Close Documentation generated by JSDoc 4.0.5 on 2026-06-21T08:49:52+02:00 using the DocStrap template. "},"Utils.html":{"id":"Utils.html","title":"Class: Utils","body":" Documentation Classes BaseBatteryTrackerCommunicatorGameGameplayGeoMapsGeoTrackerPlayerReplayPlayerStatisticUtilsValidator Class: Utils Utils The Utils class only contains static methods to make work easier. new Utils() Version: 0.1.0 Since: 2026-06-18 Author: Markus Götz Example const guid = Utils.guid(); Methods &lt;static&gt; closeFullImage() This static method closes the full screen view layer. Returns: Type void Example Utils.closeFullImage(); &lt;static&gt; guid() This static method creates a GUID. Returns: guid A GUID Type string Example const guid = Utils.guid(); &lt;static&gt; log(mixContent) This static method displays a console on the screen to display data, which can be very useful on mobile devices. Parameters: Name Type Description mixContent mixed The content to be displayed in the console Returns: Type void Example Utils.log( mixContent ); &lt;static&gt; playMessagePiep() This static method plays a New Message tone. Returns: Type void Example Utils.playMessagePiep(); &lt;static&gt; s4() This static method generates a random string. Returns: randomString A random string Type string Example let randomString = Utils.s4(); &lt;static&gt; stringToJsTimestamp(dateTimeString) This static method converts a datetime string into a JavaScript timestamp. Parameters: Name Type Description dateTimeString string The date time string Returns: timestamp The JavaScript Timestamp Type number Example let timestamp = Utils.stringToJsTimestamp( dateTimeString ); &lt;static&gt; stringToPhpTimestamp(dateTimeString) This static method converts a datetime string into a Php timestamp. Parameters: Name Type Description dateTimeString string The date time string Returns: timestamp The Php Timestamp Type number Example let timestamp = Utils.stringToPhpTimestamp( dateTimeString ); &lt;static&gt; timestampJsToString(timestamp, seconds, format) This static method converts a JavaScript timestamp into a human-readable format. Parameters: Name Type Description timestamp number The JavaScript Timestamp seconds boolean Should the seconds be returned for the time with true or false format string The return format, date for just the date, time for just the time, or datetime for both the date and time Returns: dateTimeString The date time string Type string Example let dateTimeString = Utils.timestampJsToString( timestamp, seconds, format ); &lt;static&gt; timestampPhpToString(timestamp, seconds, format) This static method converts a Php timestamp into a human-readable format. Parameters: Name Type Description timestamp number The Php Timestamp seconds boolean Should the seconds be returned for the time with true or false format string The return format, date for just the date, time for just the time, or datetime for both the date and time Returns: dateTimeString The date time string Type string Example let dateTimeString = Utils.timestampPhpToString( timestamp, seconds, format ); &lt;static&gt; triggerMessageVibration() This static method triggers a vibration on an Android phone. Returns: Type void Example Utils.triggerMessageVibration(); × Search results Close Documentation generated by JSDoc 4.0.5 on 2026-06-21T08:49:52+02:00 using the DocStrap template. "},"Validator.html":{"id":"Validator.html","title":"Class: Validator","body":" Documentation Classes BaseBatteryTrackerCommunicatorGameGameplayGeoMapsGeoTrackerPlayerReplayPlayerStatisticUtilsValidator Class: Validator Validator This class represents the Validator class with all properties and methods. The Validator class validates input fields as well as passwords and email addresses and throws form errors if necessary. If a button with the Css class: submit is present in a form, it will be disabled or enabled. The event handler for form validation is called when an object is instantiated. new Validator() This method is the constructor of the class. Version: 0.1.0 Since: 2026-06-18 Author: Markus Götz Returns: Type void Example const validator = new Validator(); Methods _validateEmail(email) This method checks an email address for validity and returns the result of the check. Parameters: Name Type Description email string The email address Returns: isValide The result of the check, true: is valid, false: is not valid Type boolean Examples let isValide = validator._validateEmail( email ); let isValide = this._validateEmail( email ); _validateField(key, form) This method checks the field passed with the input field name whether it meets all the guidelines the input field is stored (fields.json). Parameters: Name Type Description key string The name of the input field form object The form in which the key is located Returns: formIsValide The result of the check, true: is valid, false: is not valid Type boolean Examples let formIsValide = validator._validateField( key, form ); let formIsValide = this._validateField( key, form ); _validateFieldSetFormError(event) This method sets or removes a FormError from the input fields of a form when typing with the keyboard or changing the field. Parameters: Name Type Description event object The triggering event Returns: Type void Examples validator._validateFieldSetFormError( event ); this._validateFieldSetFormError( event ); _validateFields() This method loops through all forms and their fields on the current page and validates the input. Furthermore, it switches the buttons with the Css class: Submit to disable or enable. Returns: Type void Examples validator._validateFields(); this._validateFields(); _validatePassword(password) This method is specifically for passwords and checks the password against the stored rules. Parameters: Name Type Description password string The password Returns: isValide The result of the check, true: is valid, false: is not valid Type boolean Examples let isValide = validator._validatePassword( password ); let isValide = this._validatePassword( password ); get(property) This method is the default getter of the class. Parameters: Name Type Description property string The property of the value Returns: value The value of the property Type mixed Examples let value = validator.get( property ); let value = this.get( property ); manageFormErrors(formErrors) This method loops through the Form Error array and sets or resets the Form Error at the input field. Parameters: Name Type Description formErrors object The array with Form Errors Returns: Type void Examples validator.manageFormErrors( formErrors ); this.manageFormErrors( formErrors ); registerEventHandler() This method registers an event handler that searches the page for forms and form fields and this is automatically validated. Returns: Type void Examples validator.registerEventHandler(); this.registerEventHandler(); resetFormErrors() This method resets the Errors form in all input fields of all forms. Returns: Type void Examples validator.resetFormErrors(); this.resetFormErrors(); set(property, value) This method is the default setter for the class. Parameters: Name Type Description property string The property that you want to set value mixed The value you want to set to the property Returns: Type void Examples validator.set( property, value ); this.set( property, value ); validateFields() This method goes through all forms and their input fields and attaches three to each input field Event handlers. One when changing the input field, one when leaving the input field and one when pressing a key in the input field. Returns: Type void Examples validator.validateFields(); this.validateFields(); × Search results Close Documentation generated by JSDoc 4.0.5 on 2026-06-21T08:49:52+02:00 using the DocStrap template. "}}
