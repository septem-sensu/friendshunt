ing The context under which the key is located whose value should be fetched key string The key whose value should be fetched Returns: value The value which is stored in local storage Type * Example let value = baseObject.getLocalStorage( 'game_6a350ae8600042.28612508', 'lastMessageId' ); processResponse(response) This method receives the response from the Communicator class and sets the class variables and executes the method of the class that was specified as a callbackMethod in the request. Parameters: Name Type Description response object The response of the query from the Communicator class Returns: Type void Example baseObject.processResponse( response ); registerEventHandler() This method registers all event handlers that are necessary for the class. The method should be executed by the derived classes. Returns: Type void Example baseObject.registerEventHandler(); set(property, value) This method is the default setter for the class and the derived classes. Parameters: Name Type Description property string The property that you want to set value * The value you want to set to the property See: BaseObject#get Returns: Type void Example baseObject.set( property, value ); setLocalStorage(context, key, value) This method saves a value on a key under a specific context in local storage. If you pass an empty string as the key, the context is deleted. If an empty string is passed as a value, the key is deleted. Parameters: Name Type Description context string The context under which the key lies key string The key under which the value should be saved value * The value that you want to store under a key in a specific context Returns: Type void Example baseObject.setLocalStorage( 'game_6a350ae8600042.28612508', 'lastMessageId', 'message_6a2c5e4deb5426.99254536' ); unhideGameAdministratorButtons() This method shows the buttons for which the user has the rights. This method hides all other buttons. Returns: Type void Example baseObject.unhideGameAdministratorButtons(); × Search results Close Documentation generated by JSDoc 4.0.5 on 2026-06-27T13:09:24+02:00 using the DocStrap template. "},"BatteryTracker.html":{"id":"BatteryTracker.html","title":"Class: BatteryTracker","body":" Documentation Classes BaseObjectBatteryTrackerCommunicatorGameGameplayGeoMapsGeoTrackerPlayerReplayPlayerStatisticUtilsValidator Class: BatteryTracker BatteryTracker BatteryTracker Class for the Friends Hunt App. This Class represents the Battery Tracker Class for the Friends Hunt App with its Properties and Methods. The Class is for handling Battery Level and is charging. Unfortunately, accessing the battery does not work on the iPhone. new BatteryTracker() This method is the constructor of the class. Version: 0.1.0 Since: 2026-06-05 Author: Markus Götz Returns: Type void Example const batteryTracker = new BatteryTracker(); Methods get(property) This Method is the default getter of the Class. Parameters: Name Type Description property string The Property to get See: BatteryTracker#set Returns: value The Value of the Property Type * Example let value = batteryTracker.get( property ); getBatteryData() This Method returns the current Battery State with Battery Level and is the Battery curren charging. Returns: batteryState The current battery state with level, charging and supported properties Type object Example const batteryState = batteryTracker.getBatteryData(); init() This Method initializes the Battery API and binds the event listeners. Returns: promise Returns a promise once initialization is complete Type Promise Example const promise = batteryTracker.init(); set(property, value) This Method is the default setter of the Class. Parameters: Name Type Description property string The Property to set value * The Value to set See: BatteryTracker#get Returns: Type void Example batteryTracker.set( property, value ); updateBatteryData() This Method updates the internal properties when the API fires an event. The Method is the Callback Function of the init Method. Returns: Type void Example batteryTracker.updateBatteryData(); × Search results Close Documentation generated by JSDoc 4.0.5 on 2026-06-27T13:09:24+02:00 using the DocStrap template. "},"Communicator.html":{"id":"Communicator.html","title":"Class: Communicator","body":" Documentation Classes BaseObjectBatteryTrackerCommunicatorGameGameplayGeoMapsGeoTrackerPlayerReplayPlayerStatisticUtilsValidator Class: Communicator Communicator This communication class for the app. All requests go through this class. The class contains all required properties and methods. The class requires the Validator class. new Communicator() This method is the constructor of the class. Version: 0.1.0 Since: 2026-06-18 Author: Markus Götz See: Validator Returns: Type void Example const communicator = new Communicator(); Methods addToOfflineDb(requestObject) This method adds a failed request to the offline queue. Parameters: Name Type Description requestObject object The request object containing getParams and postParams Returns: promise A Promise that resolves when the entry has been added Type Promise Example communicator.addToOfflineDb( requestObject ); flushOfflineQueue() This method flushes all queued offline tracking data to the server. The requests are sent as fire-and-forget (the response is not processed) so that the map is not updated with old positions. Returns: Type void Example communicator.flushOfflineQueue(); get(property) This method is the default getter of the class and the derived class. Parameters: Name Type Description property string The property of the value See: Communicator#set Returns: value The value of the property Type * Example let value = communicator.get( 'maxRequestCount' ); getAllFromOfflineDb() This method retrieves all entries from the offline queue, sorted by client timestamp (oldest first). Returns: promise A Promise that resolves with an array of queued entries Type Promise Example communicator.getAllFromOfflineDb().then( ( entries ) =&gt; { ... } ); getCountFromOfflineDb() This method returns the number of entries currently in the offline queue. Returns: promise A Promise that resolves with the count of entries Type Promise.&lt;number&gt; Example communicator.getCountFromOfflineDb().then( ( count ) =&gt; { ... } ); init() This method initializes the Communicator class and registers the necessary event handlers, among other things, the online status for processing the offline queue. Returns: Type void Example communicator.init(); manageRedirects(redirect) This method redirects to a redirect url if desired Parameters: Name Type Description redirect string The Redirect Url Returns: Type void Example communicator.manageRedirects( '?view=Game' ); manageRequestQueue() This method controls the request queue. The method passes the request objects one after the other to the _request method until a current request has been processed. Returns: Type void Example communicator.manageRequestQueue(); newJsonRequestObject(className, method, id) This method returns a request object for the Communicator to which you can attach further data. Parameters: Name Type Description className string The class name of the object method string The method to be executed on the server id string The ID of the object on which the method should be executed Returns: requestObject The finished request object for the communicator Type object Example const requestObject = communicator.newJsonRequestObject( 'Player', 'deletePlayer', 'max@musterman.de' ); openOfflineDb() This method opens the IndexedDB connection. If the database does not exist, it is created with the required object store and index. Returns: promise A Promise that resolves with the IDBDatabase instance Type Promise Example communicator.openOfflineDb().then( ( db ) =&gt; { ... } ); processResponse(request, response) This method takes the response from the request, checks for errors, and forwards it to a redirect if desired and passes the response information to the callback method. Parameters: Name Type Description request object The request object that was sent to the endpoint response object The response object that came back from the endpoint and is passed on to the callback method Returns: Type void Example communicator.processResponse( request, response ); removeFromOfflineDb(id) This method removes an entry from the offline queue by its ID. Parameters: Name Type Description id number The ID of the entry to remove Returns: promise A Promise that resolves when the entry has been removed Type Promise Example communicator.removeFromOfflineDb( 1 ); request(method, getParams, postParams, callbackMethod, offlineRequest, offlineDbEntryId) This method receives the request objects, prepares them and pushes them into the request queue. Parameters: Name Type Description method string The method in which the data should be sent to the endpoint getParams object All parameters that should be appended to the Url as Url parameters postParams object All parameters that should be sent as post parameters (the request object) callbackMethod function The callback method to which the response data should be passed offlineRequest boolean Whether this request comes from the offline queue offlineDbEntryId number The ID of the entry in the offline database Returns: Type void Example communicator.request( 'POST', {}, {}, ref.function ); set(property, value) This method is the default setter for the class and the derived classes. Parameters: Name Type Description property string The property that you want to set value * The value you want to set to the property See: Communicator#get Returns: Type void Example communicator.set( 'property', 5 ); setFields(object) The response object contains an object that is compatible with the currently accessed page these input Html fields are set from the object. Parameters: Name Type Description object object The object from the response from the endpoint Returns: Type void Example communicator.setFields( object ); × Search results Close Documentation generated by JSDoc 4.0.5 on 2026-06-27T13:09:24+02:00 using the DocStrap template. "},"Game.html":{"id":"Game.html","title":"Class: Game","body":" Documentation Classes BaseObjectBatteryTrackerCommunicatorGameGameplayGeoMapsGeoTrackerPlayerReplayPlayerStatisticUtilsValidator Class: Game Game The Game class manages the individual games and contains all the required properties, methods and event handlers. This class requires the GeoTracker class, the GeoMaps class and inherits from the Base class. The Game class registers all required event handlers when instantiating. new Game() This method is the constructor of the class. Version: 0.1.0 Since: 2026-06-18 Author: Markus Götz See: BaseObject GeoTracker GeoMaps Utils Returns: Type void Example const game = new Game(); Methods addGameImagesContent() This method inserts the images of a game into the designated location on the dashboard. Returns: Type void Example game.addGameImagesContent(); addGameplayDataToTemplate() This method fetches the individual players from the end point and inserts them in their roles into the game dashboard in the designated places. Returns: Type void Example game.addGameplayDataToTemplate(); bringBackArchiveGame(element) This method fires a request to the endpoint via the Communicator object to bring an archived game back to the dashboard. Parameters: Name Type Description element object The element (button) that was clicked to find out the game ID Returns: Type void Example game.bringBackArchiveGame( element ); deleteArchiveGame(element) This method creates a Request object and fires it via the Communicator object to the endpoint for a game which is in the archive to be deleted. Parameters: Name Type Description element object The element (button) that was clicked to find out the game ID Returns: Type void Example game.deleteArchiveGame( element ); getGameArchiveList() This method fires a request to the endpoint to get the data of the archived games. The response of this method is passed from the Communicator object to the processResponseGameArchiveList. Returns: Type void Example game.getGameArchiveList(); processResponseGameArchiveList(response) This method prepares the response information from the getGameArchiveList request and Adds the archived games to the archive list at the designated location. Parameters: Name Type Description response object The response object from the endpoint Returns: Type void Example game.processResponseGameArchiveList( response ); registerEventHandler() This method registers all event handlers that are necessary for the class. The method is called when instantiating a Game object. The method also calls the Super method of the Base Object. Returns: Type void Example game.registerEventHandler(); showMapInInfoLayer(lat, lng, precision, message) This method shows a game's map, markers, and board in one layer. Parameters: Name Type Description lat number The latitude of a point on the map (starting point, exit point or center of the playing field) lng number The longitude of a point on the map (start point, exit point, or the center of the playing field) precision number The precision in meters, which indicates the accuracy of the latitude and longitude message object A message (not currently used) Returns: Type void Example game.showMapInInfoLayer(); startGame() This method starts a game and sends all the required information to the endpoint. The response returns the game settings and the game status. Returns: Type void Example game.startGame(); × Search results Close Documentation generated by JSDoc 4.0.5 on 2026-06-27T13:09:24+02:00 using the DocStrap template. "},"Gameplay.html":{"id":"Gameplay.html","title":"Class: Gameplay","body":" Documentation Classes BaseObjectBatteryTrackerCommunicatorGameGameplayGeoMapsGeoTrackerPlayerReplayPlayerStatisticUtilsValidator Class: Gameplay Gameplay The Gameplay class controls the game with all the options the game offers. This class requires the Communicator class, the GeoTracker class, the GeoMaps class, the Game class and the Battery Tracker class. The class controls the Silent Hunts, the Speed Hunts, fires the tracking to the end point, counts steps and monitors the device's battery level. new Gameplay(playerId, gameId, gameSettings) This method is the constructor of the class. Parameters: Name Type Description playerId string The current player's ID gameId string The Game ID of the game to be played gameSettings object The Game Settings object with all of the game's settings Version: 0.1.0 Since: 2026-06-18 Author: Markus Götz See: Game Communicator GeoTracker GeoMaps BatteryTracker ReplayPlayer Utils Returns: Type void Example const gameplay = new Gameplay( playerId, gameId, gameSettings ); Methods checkSystemMessages() This method checks whether new system messages have been received and displays them to the player in a layer. if there are new system messages, the player will be alerted with a beep a vibrator is triggered on Android cell phones. Returns: Type void Example gameplay.checkSystemMessages(); generateReplayData(response) This method is the callback method from the getReplayData method. The method creates a replay object in which the tracking of all players is in an array sorted by timestamp. After the Replay object is created, this method calls the startReplayPlayer method to start the Replay Player. Parameters: Name Type Description response object The response object from the endpoint with the tracking data Returns: Type void Example gameplay.generateReplayData( response ); getReplayData() This method creates a Request Object for fetching the complete tracking data for the current game and fires it to the endpoint via the Communicator Object. The callback method that processes the response is the generateReplayData method. The request is only generated if there is no tracking data on the object yet, otherwise the ReplayPlayer is instantiated using the startReplayPlayer method. Returns: Type void Example gameplay.getReplayData(); init() This method initializes the object and is called when instantiated from the class. The method sets the position of the card, starts interval tracking and starts wake lock. Returns: Type void Example gameplay.init(); processResponse(response) This method controls the callback methods from the endpoint requests and passes them Response data to the respective callback method. Parameters: Name Type Description response object The Response object returned by the Communicator object Returns: Type void Example gameplay.processResponse( response ); registerEventHandler() This method registers all required event handlers of the game. The method is called when instantiating an object via the init method. Returns: Type void Example gameplay.registerEventHandler(); sendCaptured() This method creates a request object with the information that you were caught and who caught you. This request object is fired to the endpoint via the Communicator object. Returns: Type void Example gameplay.sendCaptured(); setMap(lat, lng, precision, message) This method sets the map over the GeoMaps object such as the start point, the exit point and the playing field. Parameters: Name Type Description lat number The latitude of a point on the map (starting point, exit point or center of the playing field) lng number The longitude of a point on the map (start point, exit point, or the center of the playing field) precision number The precision in meters, which indicates the accuracy of the latitude and longitude message object A message (not currently used) Returns: Type void Example gameplay.setMap( lat, lng, precision, message ); setMessages() This method places the messages in the message layer and scrolls to the end of the message list. Returns: Type void Example gameplay.setMessages(); setPosition(gameplayRole, tracking, playerCount) This method sets the positions of each player on the map and populates the popup of players on the map with all necessary information. Parameters: Name Type Description gameplayRole string The player role in the game (player, hunter or game leader) tracking object The current tracking object with all important information and movement data playerCount number The player number if the player names should not be displayed Returns: Type void Example gameplay.setPosition( gameplayRole, tracking, playerCount ); setPositions(response) This method evaluates the response from the end point and controls all other methods that set the positions of the players on the map, displays messages and system messages, updates the status bar and checks the game rules. Parameters: Name Type Description response object The response object with all currently important information about the game Returns: Type void Example gameplay.setPositions( response ); setStateLine() This method sets the status line in the game with all currently important information. Important information includes, for example, when the next Silent Hunt is, whether there is a Speed Hunt is running or when this is possible. Returns: Type void Example gameplay.setStateLine(); setStates() This method sets different states to the current gameplay. The method is executed when the class is instantiated and with every response. Returns: Type void Example gameplay.setStates(); showCaptureLayer() This method shows the captured layer in the game with all selectable Hunters. Returns: Type void Example gameplay.showCaptureLayer(); showMessageLayer() This method opens or closes the player's message layer. Returns: Type void Example gameplay.showMessageLayer(); speedHunt(speedHuntPlayerId) This method creates a request object for a speed hunt and fires it to the endpoint via the communicator object. The method can only be used by hunters. Parameters: Name Type Description speedHuntPlayerId string The Player ID to which the Speed ​​Hunt Ping should be fired Returns: Type void Example gameplay.speedHunt( 'max@musterman.de' ); startReplayPlayer() This method instantiates the ReplayPlayer and removes the hidden Css class from the Replay Player panel. Returns: Type void Example gameplay.startReplayPlayer(); timestampNow() This method returns a Php timestamp of the current time. Returns: timestampNow The Php timestamp at the current time Type number Example let timestampNow = gameplay.timestampNow(); track(lat, lng, precision, message) This method creates a tracking object with longitude, longitude, number of steps, battery level and some more and sends this tracking object to the endpoint via the Communicator object. The response is passed to the setPositions method for processing. Parameters: Name Type Description lat number The latitude of a point on the map (starting point, exit point or center of the playing field) lng number The longitude of a point on the map (start point, exit point, or the center of the playing field) precision number The precision in meters, which indicates the accuracy of the latitude and longitude message object A message (not currently used) Returns: Type void Example gameplay.track( lat, lng, precision, message ); × Search results Close Documentation generated by JSDoc 4.0.5 on 2026-06-27T13:09:24+02:00 using the DocStrap template. "},"GeoMaps.html":{"id":"GeoMaps.html","title":"Class: GeoMaps","body":" Documentation Classes BaseObjectBatteryTrackerCommunicatorGameGameplayGeoMapsGeoTrackerPlayerReplayPlayerStatisticUtilsValidator Class: GeoMaps GeoMaps Geo Maps Class for the Friends Hunt App. This Class represents the Geo Maps Class for the Friends Hunt App with his Properties and Methods. The Class is for handling Leaflet with OpenStreetMap. new GeoMaps() This Method is the Constructor for this Class. Version: 0.1.0 Since: 2026-06-05 Author: Markus Götz See: leaflet Returns: Type void Example const geoMaps = new GeoMaps(); Methods addMarkerCssClass(id, cssClass) This Method add a css Class to a Marker Icon. Parameters: Name Type Description id string The Game Player Id (Marker Id) cssClass string The css Class to add the Marker Icon Returns: Type void Example geoMaps.addMarkerCssClass( id, cssClass ); bindResizeEvents(id, selectorRadius) This Method is a Helper Method to bind Event Listener for Drag and Drop to set the circle radius on the Map interactive. Parameters: Name Type Description id string The Game Player Id (Circle Id) selectorRadius number The Selector of a input Field to set the radius Returns: Type void Example geoMaps.bindResizeEvents( id, selectorRadius ); containsMarkerCssClass(id, cssClass) This Method check a Marker Icon whether contains a css Class. Parameters: Name Type Description id string The Game Player Id (Marker Id) cssClass string The css Class to remove from the Marker Icon Returns: result Contains the css Class at the Marker Icon Type boolean Example const result = geoMaps.containsMarkerCssClass( id, cssClass ); get(property) This Method is the default getter of the Class. Parameters: Name Type Description property string The Property to get See: GeoMaps#set Returns: value The Value of the Property Type * Example let value = geoMaps.get( property ); getDistance(id1, id2) This Method return the calculated distance between two Ids in Meters. Parameters: Name Type Description id1 string The Id1 id2 string The Id2 Returns: distance The distance between two Ids in Meters Type number Example const distance = geoMaps.getDistance( id1, id2 ); getIcon(role, color, name) This Method returns a Icon Vector Object for the Game Player Role. Parameters: Name Type Description role string The Game Player Role (player, hunter or management) color string The Game Player Color name string The Text at the Icon Returns: icon The Leaflet DivIcon Object Type object Example const icon = geoMaps.getIcon( role, color, name ); getPosition(id) This Method return the Position Object of a Id. Parameters: Name Type Description id string The Id Returns: position The Leaflet Position Object Type object Example const position = geoMaps.getPosition( id ); removeMarker(id) This Method remove a Marker from the Map. Parameters: Name Type Description id string The Game Player Id to remove from Map Returns: Type void Example geoMaps.removeMarker( id ); removeMarkerCssClass(id, cssClass) This Method remove a css Class from a Marker Icon. Parameters: Name Type Description id string The Game Player Id (Marker Id) cssClass string The css Class to remove from the Marker Icon Returns: Type void Example geoMaps.removeMarkerCssClass( id, cssClass ); set(property, value) This Method is the default setter of the Class. Parameters: Name Type Description property string The Property to set value * The Value to set See: GeoMaps#get Returns: Type void Example geoMaps.set( property, value ); setCircle(id, lat, lng, size, color, weight, fillColor, opacity) This Method set a circle on the Map. Parameters: Name Type Description id string The Game Player Id (Circle Id) lat number The Latitude of the Center of the Circle lng number The Longitude of the Center of the Circle size number The Radius of the Circle color string The Color of the Circle edge weight number The weight of the Circle edge fillColor string The fill Color of the Circle opacity number The Opacity of the Circle Returns: Type void Example geoMaps.setCircle( id, lat, lng, size, color, weight, fillColor, opacity ); setCircleInteractive(id, size, color, weight, fillColor, opacity, selector, selectorRadius) This Method set a circle on the Map interactive with click to the Map. Parameters: Name Type Description id string The Game Player Id (Circle Id) size number The Radius of the Circle color string The Color of the Circle edge weight number The weight of the Circle edge fillColor string The fill Color of the Circle opacity number The Opacity of the Circle selector string The Selector of a input Field to set the coordinates selectorRadius string The Selector of a input Field to set the radius Returns: Type void Example geoMaps.setCircleInteractive( id, size, color, weight, fillColor, opacity, selector, selectorRadius ); setIcon(id, role, color, name) This Method set a new Icon on the Marker. Parameters: Name Type Description id string The Game Player Id (Marker Id) role string The Game Player Role (player, hunter or management) color string The Game Player Color name string The Text at the Icon Returns: Type void Example geoMaps.setIcon( id, role, color, name ); setMap(lat, lng) This Method set the Map in the Page. Parameters: Name Type Description lat number The current Latitude lng number The current Longitude Returns: map The Leaflet Map Object Type object Example const map = geoMaps.setMap( lat, lng ); setMarker(id, role, color, lat, lng, content, name, cssclass) This Method set a Marker with Popup on the Map. Parameters: Name Type Description id string The Game Player Id (Marker Id) role string The Game Player Role (player, hunter or management) color string The Game Player Color lat number The Latitude of the Game Player lng number The Longitude of the Game Player content string The Content of the Popup name string The Text at the Icon cssclass string The css Class for the Icon Returns: Type void Example geoMaps.setMarker( id, role, color, lat, lng, content, name ); setMarkerInteractive(id, role, color, content, selector) This Method set a Marker with Popup interactive with click on the Map. Parameters: Name Type Description id string The Game Player Id (Marker Id) role string The Game Player Role (player, hunter or management) color string The Game Player Color content string The Content of the Popup selector string The Selector of a input Fiel to set the coordinates Returns: Type void Example geoMaps.setMarkerInteractive( id, role, color, content, selector ); × Search results Close Documentation generated by JSDoc 4.0.5 on 2026-06-27T13:09:24+02:00 using the DocStrap template. "},"GeoTracker.html":{"id":"GeoTracker.html","title":"Class: GeoTracker","body":" Documentation Classes BaseObjectBatteryTrackerCommunicatorGameGameplayGeoMapsGeoTrackerPlayerReplayPlayerStatisticUtilsValidator Class: GeoTracker GeoTracker Geo Tracker Class for the Friends Hunt App. This Class represents the Geo Tracker Class for the Friends Hunt App with its Properties and Methods. The Class is for handling Position Tracking, Step Counting and Calculate Distances. The Class can start interval Tracking and uses the Wake Lock API. new GeoTracker() This Method is the Constructor for this Class. Version: 0.1.0 Since: 2026-06-05 Author: Markus Götz Returns: Type void Example const geoTracker = new GeoTracker(); Methods calcDistance(lat1, lng1, lat2, lng2) This Method calculate the Distance between two Points on the Earth's surface with the Haversine-Formula. Parameters: Name Type Description lat1 number The Latitude of Waypoint 1 (float) lng1 number The Longitude of Waypoint 1 (float) lat2 number The Latitude of Waypoint 2 (float) lng2 number The Longitude of Waypoint 2 (float) Returns: distance The Distance between Waypoint 1 and Waypoint 2 in Meters (float) Type number Example const distance = geoTracker.calcDistance( lat1, lng1, lat2, lng2 ); checkPedometerSensor() This Method checked the Permission and start the Pedometer to count the steps. Returns: Type void Example geoTracker.checkPedometerSensor(); get(property) This Method is the default getter of the Class. Parameters: Name Type Description property string The Property to get See: GeoTracker#set Returns: value The Value of the Property Type * Example const value = geoTracker.get( property ); getCurrentPosition(callbackSuccess) This Method get the current Position, called the Callback Function and hand over the Position Data. Parameters: Name Type Description callbackSuccess function The callback function for the position Returns: Type void Example geoTracker.getCurrentPosition( callbackSuccess ); set(property, value) This Method is the default setter of the Class. Parameters: Name Type Description property string The Property to set value * The Value to set See: GeoTracker#get Returns: Type void Example geoTracker.set( property, value ); startIntervalTracking(callbackSuccess) This Method start the interval Tracking and get periodically the current Position, called the Callback Function and hand over the Position Data. Parameters: Name Type Description callbackSuccess function The callback function for the position Returns: Type void Example geoTracker.startIntervalTracking( callbackSuccess ); startPedometer() This Method start the Pedometer to count the steps. Returns: Type void Example geoTracker.startPedometer(); &lt;async&gt; startWakeLock() This Method starts the Wake Lock, so that the Device does not go into Sleep Mode or lock the Screen. Returns: Type void Example geoTracker.startWakeLock(); stopIntervalTracking() This Method stop the interval Tracking. Returns: Type void Example geoTracker.stopIntervalTracking(); stopWakeLock() This Method stops the Wake Lock Mode, the Device can go into Sleep Mode or lock the Screen. Returns: Type void Example geoTracker.stopWakeLock(); × Search results Close Documentation generated by JSDoc 4.0.5 on 2026-06-27T13:09:24+02:00 using the DocStrap template. "},"Player.html":{"id":"Player.html","title":"Class: Player","body":" Documentation Classes BaseObjectBatteryTrackerCommunicatorGameGameplayGeoMapsGeoTrackerPlayerReplayPlayerStatisticUtilsValidator Class: Player Player This class represents the player class with all the necessary properties, methods and event handlers. The class inherits from the Base class. new Player(playerId) This method is the constructor of the class. Parameters: Name Type Description playerId string The player ID Version: 0.1.0 Since: 2026-06-18 Author: Markus Götz See: BaseObject Communicator Utils Returns: Type void Example const player = new Player( playerId ); Methods addGamesToTemplate() This method adds a player's games to the designated location in the player dashboard view. Returns: Type void Example player.addGamesToTemplate(); archiveGame(element) This method creates a request object to archive a game and fires it to the endpoint via the Communicator object. The callback method is the processResponseArchiveGame method. Parameters: Name Type Description element HTMLElement The element (button) that was clicked to find out the game ID Returns: Type void Example player.archiveGame( element ); deleteGame(element) This method creates a request object to delete a game in the player dashboard view. The Request object is fired to the endpoint via the Communicator object. The callback method for this request is the processResponseDeleteGame method. Parameters: Name Type Description element HTMLElement The element (button) that was clicked to find out the game ID Returns: Type void Example player.deleteGame( element ); deletePlayerFromApp(element) This method creates a Request object to delete the current player and fires it to the endpoint via the Communicator object. Parameters: Name Type Description element HTMLElement The element (button) that was clicked to find out the player ID Returns: Type void Example player.deletePlayerFromApp( element ); getPlayerInfoHtml(player, inputName) This method is the callback method and adds a player or a hunter or a manager in the game configuration view to the for it add designated location. Parameters: Name Type Description player object The player object to be added inputName string The input field name in which the player email address was entered Returns: Type void Example player.getPlayerInfoHtml( player, inputName ); getPlayerList() This method creates a Request object to fetch the players of a game and fires it to the endpoint via the Communicator object. The callback method is the processResponsePlayerList method which further processes the player data. Returns: Type void Example player.getPlayerList(); processResponseAddHunterToGame(response) This method is the callback method and adds a hunter in the game configuration view to the for it add designated location. Parameters: Name Type Description response object The Response object returned by the Communicator object Returns: Type void Example player.processResponseAddHunterToGame( response ); processResponseAddManagementToGame(response) This method is the callback method and adds a manager in the game configuration view to the for it add designated location. Parameters: Name Type Description response object The Response object returned by the Communicator object Returns: Type void Example player.processResponseAddManagementToGame( response ); processResponseAddPlayerToGame(response) This method is the callback method and adds a player in the game configuration view to the for it add designated location. Parameters: Name Type Description response object The Response object returned by the Communicator object Returns: Type void Example player.processResponseAddPlayerToGame( response ); processResponseArchiveGame(response) This method is the callback method of the archiveGame method and updates the games in the player dashboard view. Parameters: Name Type Description response object The Response object returned by the Communicator object Returns: Type void Example player.processResponseArchiveGame( response ); processResponseDeleteGame(response) This method is the callback method from the deleteGame method and updates the games in the player dashboard view. Parameters: Name Type Description response object The Response object returned by the Communicator object Returns: Type void Example player.processResponseDeleteGame( response ); processResponsePlayerList(response) This method is the callback method of the getPlayerList method and sets the players, hunters and game management in the designated place when creating a new game. Parameters: Name Type Description response object The Response object returned by the Communicator object To Do: Player avatar must be fetched by the player and not saved in the games folder. Returns: Type void Example player.processResponsePlayerList( response ); registerEventHandler() This method registers all event handlers that are necessary for the class. The method is called when instantiating a Player object. The method also calls the Super method of the Base Object. Returns: Type void Example player.registerEventHandler(); startGame(element) This method starts a selected game from the player dashboard view. Parameters: Name Type Description element HTMLElement The element (button) that was clicked to find out the game ID Returns: Type void Example player.startGame( element ); × Search results Close Documentation generated by JSDoc 4.0.5 on 2026-06-27T13:09:24+02:00 using the DocStrap template. "},"ReplayPlayer.html":{"id":"ReplayPlayer.html","title":"Class: ReplayPlayer","body":" Documentation Classes BaseObjectBatteryTrackerCommunicatorGameGameplayGeoMapsGeoTrackerPlayerReplayPlayerStatisticUtilsValidator Class: ReplayPlayer ReplayPlayer This class represents the ReplayPlayer class with all necessary properties, methods and event handlers. The Replay class uses the tracking data to create a replay of all players on the map at multiple speeds. new ReplayPlayer(replayData, gameplay) This method is the constructor of the class. Parameters: Name Type Description replayData object The sorted tracking data gameplay object The calling gameplay object Version: 0.1.0 Since: 2026-06-18 Author: Markus Götz See: Gameplay GeoMaps Utils Returns: Type void Example const replayPlayer = new ReplayPlayer( replayData, gamePlay ); Methods calculateIntermediatePoint(playerId, targetTimestamp) This method gets the players' positions from the tracking data and calculates intermediate positions around jumping to prevent the individual positions. The method returns the position or intermediate position. Parameters: Name Type Description playerId string The player ID for which the position or intermediate position should be calculated targetTimestamp number The timestamp of the time at which the players' markers should be placed Returns: position An object with the position or intermediate position of a player Type object Example position = replayPlayer.calculateIntermediatePoint( playerId, targetTimestamp ); get(property) This method is the default getter of the class. Parameters: Name Type Description property string The property of the value See: ReplayPlayer#set Returns: value The value of the property Type * Example let value = replayPlayer.get( property ); init() This method initializes the object and registers all required event handlers Returns: Type void Example replayPlayer.init(); pause() This method pauses the replay on the map at the current location. Returns: Type void Example replayPlayer.pause(); play() This method starts the replay on the map with all players at multiple speeds. Returns: Type void Example replayPlayer.play(); renderTargetTime(targetTimestamp) This method renders the players' positions on the map and sets the players' markers. Parameters: Name Type Description targetTimestamp number The timestamp of the time at which the players' markers should be placed Returns: Type void Example replayPlayer.renderTargetTime( targetTimestamp ); set(property, value) This method is the default setter for the class. Parameters: Name Type Description property string The property that you want to set value * The value you want to set to the property See: ReplayPlayer#get Returns: Type void Example replayPlayer.set( property, value ); startHighlight(playerId, highlightTimestamp, timelineIndex) This method can be used for highlights, it sets the timeline by 5 tracking points of the passed player back, reduces the speed, sets the center of the map on the passed player and zooms in on this point. The “camera” then moves back to the starting point and leaves the replay in the expire old speed. Parameters: Name Type Description playerId string The ID of the player this highlight is about highlightTimestamp number The timestamp of the timeline to the normal timeline was interrupted timelineIndex number The index of the timeline where the highlight was started Returns: Type void Example replayPlayer.startHighlight( 'max@musterman.de', 1782150381, 378 ); toggleButtonClass(activeBtn, inactiveBtnId) This method switches the HTML button objects for playing and pausing the replay active or inactive Parameters: Name Type Description activeBtn object The currently active Html button object which should become inactive inactiveBtnId string The Css selector of the Html button object that should become active Returns: Type void Example replayPlayer.toggleButtonClass( activeBtn, inactiveBtnId ); × Search results Close Documentation generated by JSDoc 4.0.5 on 2026-06-27T13:09:24+02:00 using the DocStrap template. "},"Statistic.html":{"id":"Statistic.html","title":"Class: Statistic","body":" Documentation Classes BaseObjectBatteryTrackerCommunicatorGameGameplayGeoMapsGeoTrackerPlayerReplayPlayerStatisticUtilsValidator Class: Statistic Statistic This class represents the statistics class with all required properties and methods. The statistics class parses the tracking data, generates statistics from it and appends them in the designated places in the game dashboard view. This class requires the GeoTracker class and the Communicator class. new Statistic(selector) This method is the constructor of the class. Parameters: Name Type Description selector string The Css selector where the statistics should be inserted Version: 0.1.0 Since: 2026-06-18 Author: Markus Götz See: GeoTracker Communicator Returns: Type void Example const statistic = new Statistic( selector ); Methods addCapturedContainer() This method generates the overview container for captured players and inserts it into the designated locations in the game dashboard view. Returns: Type void Example statistic.addCapturedContainer(); addGameOverviewContainer() This method generates the game overview container and inserts it into the designated locations in the game dashboard view. Returns: Type void Example statistic.addGameOverviewContainer(); addMessagesContainer() This method generates the messages overview container and inserts it into the designated locations in the game dashboard view. Returns: Type void Example statistic.addMessagesContainer(); addOutOfPlayfield() This method generates the Out of Field / Rule Breaking container and inserts it into the designated locations in the Game Dashboard view. Returns: Type void Example statistic.addOutOfPlayfield(); addPlayerDistancesContainers() This method generates the overview container for the distances and steps taken by the players and inserts it into the designated places in the game dashboard view. Returns: Type void Example statistic.addPlayerDistancesContainers(); addSpeedHuntsContainer() This method generates the game Speed Hunt container and inserts it into the designated locations in the game dashboard view. Returns: Type void Example statistic.addSpeedHuntsContainer(); gameStatistic() This method generates a tracking object from the players' existing tracking data with which the other methods can work better and returns it. Returns: statistic The created Statistic object Type object Example const result = statistic.gameStatistic(); generateGameStatistics(response) This method controls the generation of statistics and is the callback method from the getGameStatistics method. Parameters: Name Type Description response object The Response object returned by the Communicator object Returns: Type void Example statistic.generateGameStatistics( response ); get(property) This method is the default getter of the class. Parameters: Name Type Description property string The property of the value See: Statistic#set Returns: value The value of the property Type * Example const value = statistic.get( property ); getGameStatistics() This method creates a request object to fetch the tracking data and fires it to the endpoint via the Communicator object. The callback method is the generateGameStatistics method. Returns: Type void Example statistic.getGameStatistics(); init() This method initializes the statistics object. The method is executed when the class is instantiated. Returns: Type void Example statistic.init(); set(property, value) This method is the default setter for the class. Parameters: Name Type Description property string The property that you want to set value * The value you want to set to the property See: Statistic#get Returns: Type void Example statistic.set( property, value ); × Search results Close Documentation generated by JSDoc 4.0.5 on 2026-06-27T13:09:24+02:00 using the DocStrap template. "},"Utils.html":{"id":"Utils.html","title":"Class: Utils","body":" Documentation Classes BaseObjectBatteryTrackerCommunicatorGameGameplayGeoMapsGeoTrackerPlayerReplayPlayerStatisticUtilsValidator Class: Utils Utils The Utils class only contains static methods to make work easier. new Utils() Version: 0.1.0 Since: 2026-06-18 Author: Markus Götz Example const guid = Utils.guid(); Members globalRegisteredEvents :Object.&lt;string, boolean&gt; Global, static register to avoid multiple registrations of event handlers. Prevents double bindings, even with multiple class instances. Type: Object.&lt;string, boolean&gt; Example if( Utils.globalRegisteredEvents[ 'Gameplay' ] ) return; Utils.globalRegisteredEvents[ 'Gameplay' ] = true; Methods &lt;static&gt; closeFullImage() This static method closes the full screen view layer. Returns: Type void Example Utils.closeFullImage(); &lt;static&gt; guid() This static method creates a GUID. Returns: guid A GUID Type string Example const guid = Utils.guid(); &lt;static&gt; log(mixContent) This static method displays a console on the screen to display data, which can be very useful on mobile devices. Parameters: Name Type Description mixContent * The content to be displayed in the console Returns: Type void Example Utils.log( mixContent ); &lt;static&gt; playMessageBeep() This static method plays a New Message tone. Returns: Type void Example Utils.playMessageBeep(); &lt;static&gt; s4() This static method generates a random string. Returns: randomString A random string Type string Example const randomString = Utils.s4(); &lt;static&gt; stringToJsTimestamp(dateTimeString) This static method converts a datetime string into a JavaScript timestamp. Parameters: Name Type Description dateTimeString string The date time string Returns: timestamp The JavaScript Timestamp Type number Example const timestamp = Utils.stringToJsTimestamp( dateTimeString ); &lt;static&gt; stringToPhpTimestamp(dateTimeString) This static method converts a datetime string into a Php timestamp. Parameters: Name Type Description dateTimeString string The date time string Returns: timestamp The Php Timestamp Type number Example const timestamp = Utils.stringToPhpTimestamp( dateTimeString ); &lt;static&gt; timestampJsToString(timestamp, seconds, format) This static method converts a JavaScript timestamp into a human-readable format. Parameters: Name Type Description timestamp number The JavaScript Timestamp seconds boolean Should the seconds be returned for the time with true or false format string The return format, date for just the date, time for just the time, or datetime for both the date and time Returns: dateTimeString The date time string Type string Example const dateTimeString = Utils.timestampJsToString( timestamp, seconds, format ); &lt;static&gt; timestampPhpToString(timestamp, seconds, format) This static method converts a Php timestamp into a human-readable format. Parameters: Name Type Description timestamp number The Php Timestamp seconds boolean Should the seconds be returned for the time with true or false format string The return format, date for just the date, time for just the time, or datetime for both the date and time Returns: dateTimeString The date time string Type string Example const dateTimeString = Utils.timestampPhpToString( timestamp, seconds, format ); &lt;static&gt; triggerMessageVibration() This static method triggers a vibration on an Android phone. Returns: Type void Example Utils.triggerMessageVibration(); × Search results Close Documentation generated by JSDoc 4.0.5 on 2026-06-27T13:09:24+02:00 using the DocStrap template. "},"Validator.html":{"id":"Validator.html","title":"Class: Validator","body":" Documentation Classes BaseObjectBatteryTrackerCommunicatorGameGameplayGeoMapsGeoTrackerPlayerReplayPlayerStatisticUtilsValidator Class: Validator Validator This class represents the Validator class with all properties and methods. The Validator class validates input fields as well as passwords and email addresses and throws form errors if necessary. If a button with the Css class: submit is present in a form, it will be disabled or enabled. The event handler for form validation is called when an object is instantiated. new Validator() This method is the constructor of the class. Version: 0.1.0 Since: 2026-06-18 Author: Markus Götz Returns: Type void Example const validator = new Validator(); Methods get(property) This method is the default getter of the class. Parameters: Name Type Description property string The property of the value See: Validator#set Returns: value The value of the property Type * Example const value = validator.get( property ); manageFormErrors(formErrors) This method loops through the Form Error array and sets or resets the Form Error at the input field. Parameters: Name Type Description formErrors object The array with Form Errors Returns: Type void Example validator.manageFormErrors( formErrors ); registerEventHandler() This method registers an event handler that searches the page for forms and form fields and this is automatically validated. Returns: Type void Example validator.registerEventHandler(); resetFormErrors() This method resets the Errors form in all input fields of all forms. Returns: Type void Example validator.resetFormErrors(); set(property, value) This method is the default setter for the class. Parameters: Name Type Description property string The property that you want to set value * The value you want to set to the property See: Validator#get Returns: Type void Example validator.set( property, value ); validateFields() This method goes through all forms and their input fields and attaches three to each input field Event handlers. One when changing the input field, one when leaving the input field and one when pressing a key in the input field. Returns: Type void Example validator.validateFields(); × Search results Close Documentation generated by JSDoc 4.0.5 on 2026-06-27T13:09:24+02:00 using the DocStrap template. "}}
