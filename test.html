// Berechtigung für iOS (Safari) anfordern – muss durch einen Klick getriggert werden!
if (typeof DeviceMotionEvent.requestPermission === 'function') {
    DeviceMotionEvent.requestPermission()
        .then(permissionState => {
            if (permissionState === 'granted') {
                starteSchrittzaehler();
            }
        });
} else {
    // Android braucht meist keine extra Pop-up-Berechtigung
    starteSchrittzaehler();
}

let schrittAnzahl = 0;
let letzterImpuls = 0;

function starteSchrittzaehler() {
    window.addEventListener('devicemotion', (event) => {
        const acc = event.accelerationIncludingGravity;

        // Die Gesamt-Beschleunigung in allen 3 Achsen (X, Y, Z) berechnen
        const gesamtBeschleunigung = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);

        // Ein typischer Schritt erzeugt eine Erschütterung (Wert über ca. 12 m/s²)
        // Das 'letzterImpuls'-Zeitfenster verhindert, dass ein Schritt doppelt gezählt wird
        if (gesamtBeschleunigung > 12 && (Date.now() - letzterImpuls > 300)) {
            schrittAnzahl++;
            letzterImpuls = Date.now();
            console.log("Schritte: " + schrittAnzahl);
        }
    });
}




class GeoUtils {
    /**
     * Berechnet die Distanz zwischen zwei GPS-Koordinaten in Metern
     */
    static berechneDistanz(lat1, lng1, lat2, lng2) {
        const ERDRADIUS_IN_METERN = 6371000; // Durchschnittlicher Radius der Erde

        // Umrechnung von Grad in Bogenmaß (Radiant)
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLng = (lng2 - lng1) * Math.PI / 180;

        const a =
            Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLng / 2) * Math.sin(dLng / 2);

        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

        // Ergebnis in Metern
        const distanz = ERDRADIUS_IN_METERN * c;
        return distanz;
    }
}

// Innerhalb deiner Spieler-Klasse beim Registrieren eines neuen Standorts:
registriereNeuenStandort(neueLat, neueLng) {
    if (this.koordinatenHistorie.length > 0) {
        // Hol den direkt vorherigen Punkt (vor 30 Sekunden)
        const [letzteLat, letzteLng] = this.koordinatenHistorie[this.koordinatenHistorie.length - 1];

        // Berechne die Teilstrecke
        const deltaMeter = GeoUtils.berechneDistanz(letzteLat, letzteLng, neueLat, neueLng);

        // Plausibilitäts-Check: GPS-Sprünge (Messfehler) ignorieren
        // Wenn jemand in 30 Sekunden laut GPS 500 Meter rennt (= 60 km/h), stand er vermutlich
        // nur zwischen Hochhäusern und das Signal hat kurz gesprungen.
        if (deltaMeter < 150) {
            this.gesamteGelaufeneMeter += deltaMeter;

            // Schritte hochrechnen (Meter / Durchschnittliche Schrittlänge)
            this.geschaetzteSchritte += Math.round(deltaMeter / 0.75);
        }
    }

    // Punkt in die Historie pushen
    this.koordinatenHistorie.push([neueLat, neueLng]);
}
